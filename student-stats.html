<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学员学习状态 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 页面标题 -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">学员学习状态</h1>
        <p class="text-gray-500 text-sm mt-1">查看所有学员的学习进度和活跃度</p>
      </div>
      <div class="flex items-center gap-3">
        <select id="class-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="">全部班级</option>
        </select>
        <button onclick="exportExcel()" class="px-4 py-2 bg-green-500 text-white rounded-lg text-sm font-medium hover:bg-green-600 transition flex items-center gap-1">
          <span>📥</span> 导出 Excel
        </button>
      </div>
    </div>

    <!-- 统计概览 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p class="text-2xl font-bold text-gray-800" id="total-students">0</p>
        <p class="text-xs text-gray-500 mt-1">学员总数</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p class="text-2xl font-bold text-orange-500" id="avg-streak">0</p>
        <p class="text-xs text-gray-500 mt-1">平均连续打卡</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p class="text-2xl font-bold text-green-500" id="avg-quiz">0%</p>
        <p class="text-xs text-gray-500 mt-1">平均测验完成率</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p class="text-2xl font-bold text-purple-500" id="avg-resource">0%</p>
        <p class="text-xs text-gray-500 mt-1">平均资源阅读率</p>
      </div>
    </div>

    <!-- 学习异常预警区 -->
    <div id="alert-section" class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6 hidden">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <span class="text-xl">⚠️</span>
          <h2 class="text-lg font-semibold text-gray-800">需要关注</h2>
          <span id="alert-total" class="px-2 py-0.5 text-xs bg-red-100 text-red-600 rounded-full font-medium">0人</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleAlertFilter()" id="alert-filter-btn" class="px-3 py-1.5 text-xs bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition font-medium">只看需要关注</button>
          <button onclick="showIgnoredAlerts()" id="ignored-btn" class="px-3 py-1.5 text-xs text-gray-500 hover:text-gray-700 transition hidden">已忽略 0 项</button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="p-3 bg-red-50 rounded-lg border border-red-100">
          <div class="flex items-center gap-2">
            <span>🔴</span>
            <span class="text-sm font-medium text-red-700">长期未打卡</span>
            <span id="alert-no-checkin" class="ml-auto text-lg font-bold text-red-600">0</span>
          </div>
          <p class="text-xs text-red-500 mt-1">≥14天未学习</p>
        </div>
        <div class="p-3 bg-orange-50 rounded-lg border border-orange-100">
          <div class="flex items-center gap-2">
            <span>🟠</span>
            <span class="text-sm font-medium text-orange-700">测验未完成</span>
            <span id="alert-no-quiz" class="ml-auto text-lg font-bold text-orange-600">0</span>
          </div>
          <p class="text-xs text-orange-500 mt-1">每14天应完成≥3题</p>
        </div>
        <div class="p-3 bg-yellow-50 rounded-lg border border-yellow-100">
          <div class="flex items-center gap-2">
            <span>🟡</span>
            <span class="text-sm font-medium text-yellow-700">心得未写</span>
            <span id="alert-no-reflection" class="ml-auto text-lg font-bold text-yellow-600">0</span>
          </div>
          <p class="text-xs text-yellow-500 mt-1">每14天应完成≥1篇</p>
        </div>
      </div>
    </div>

    <!-- 学员列表 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">学员</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">班级</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">连续打卡</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">累计打卡</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">最后活跃</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">测验完成率</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">资源阅读率</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">心得</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">有效期</th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
            </tr>
          </thead>
          <tbody id="student-table-body" class="divide-y divide-gray-100">
            <tr><td colspan="9" class="px-6 py-12 text-center text-gray-400">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let allClasses = [];
    let allStudents = [];
    let showAlertOnly = false;
    let ignoredAlerts = {};

    // 加载忽略记录
    function loadIgnoredAlerts() {
      try {
        const data = localStorage.getItem('ignored_alerts');
        ignoredAlerts = data ? JSON.parse(data) : {};
      } catch (e) {
        ignoredAlerts = {};
      }
    }

    // 保存忽略记录
    function saveIgnoredAlerts() {
      localStorage.setItem('ignored_alerts', JSON.stringify(ignoredAlerts));
    }

    // 忽略某项预警
    function ignoreAlert(userId, alertType) {
      if (!ignoredAlerts[userId]) ignoredAlerts[userId] = {};
      ignoredAlerts[userId][alertType] = true;
      saveIgnoredAlerts();
      renderTable();
      updateAlertSection();
    }

    // 恢复某项预警
    function restoreAlert(userId, alertType) {
      if (ignoredAlerts[userId]) {
        delete ignoredAlerts[userId][alertType];
        if (Object.keys(ignoredAlerts[userId]).length === 0) {
          delete ignoredAlerts[userId];
        }
      }
      saveIgnoredAlerts();
      renderTable();
      updateAlertSection();
    }

    // 切换只看需要关注
    function toggleAlertFilter() {
      showAlertOnly = !showAlertOnly;
      const btn = document.getElementById('alert-filter-btn');
      if (showAlertOnly) {
        btn.textContent = '显示全部学员';
        btn.className = 'px-3 py-1.5 text-xs bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition font-medium';
      } else {
        btn.textContent = '只看需要关注';
        btn.className = 'px-3 py-1.5 text-xs bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition font-medium';
      }
      renderTable();
    }

    // 显示已忽略的预警（简单提示）
    function showIgnoredAlerts() {
      let count = 0;
      Object.values(ignoredAlerts).forEach(alerts => {
        count += Object.keys(alerts).length;
      });
      if (count === 0) {
        alert('暂无已忽略的预警');
        return;
      }
      if (confirm(`共有 ${count} 项已忽略的预警，是否全部恢复？`)) {
        ignoredAlerts = {};
        saveIgnoredAlerts();
        renderTable();
        updateAlertSection();
      }
    }

    (async function init() {
      currentSession = await requireTeacher();
      if (!currentSession) return;
      renderNavbar(currentSession, 'student-stats');

      loadIgnoredAlerts();
      await loadClasses();
      await loadAllData();

      document.getElementById('class-filter').addEventListener('change', function() {
        renderTable();
      });
    })();

    async function loadClasses() {
      try {
        const { data, error } = await sb.from('classes').select('id, name, start_date').order('created_at', { ascending: false });
        if (error) throw error;
        allClasses = data || [];
        const select = document.getElementById('class-filter');
        allClasses.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('加载班级失败:', e);
      }
    }

    async function loadAllData() {
      try {
        // 加载所有班级成员
        const { data: members, error: me } = await sb
          .from('class_members')
          .select('user_id, class_id, joined_at, profiles(id, name)')
          .order('joined_at', { ascending: true });
        if (me) throw me;

        if (!members || members.length === 0) {
          document.getElementById('student-table-body').innerHTML = '<tr><td colspan="9" class="px-6 py-12 text-center text-gray-400">暂无学员</td></tr>';
          return;
        }

        // 去重学员（一人多班只显示一次，但记录所有班级）
        const studentMap = {};
        members.forEach(m => {
          if (!studentMap[m.user_id]) {
            studentMap[m.user_id] = {
              user_id: m.user_id,
              name: m.profiles ? m.profiles.name : '未知',
              classes: [],
              classIds: []
            };
          }
          const cls = allClasses.find(c => c.id == m.class_id);
          studentMap[m.user_id].classes.push(cls ? cls.name : '未知班级');
          studentMap[m.user_id].classIds.push(m.class_id);
        });
        allStudents = Object.values(studentMap);
        const userIds = allStudents.map(s => s.user_id);

        // 批量查询所有统计数据
        const [logsRes, quizRes, resReadRes, refRes, qRes, profilesRes] = await Promise.all([
          sb.from('study_logs').select('user_id, created_at').in('user_id', userIds),
          sb.from('quiz_submissions').select('user_id, quiz_id, class_id').in('user_id', userIds),
          sb.from('resource_reads').select('user_id, resource_id, class_id').in('user_id', userIds),
          sb.from('chapter_reflections').select('user_id, class_id').in('user_id', userIds),
          sb.from('questions').select('user_id, class_id').in('user_id', userIds),
          sb.from('profiles').select('id, membership_expires_at').in('id', userIds)
        ]);

        // 按用户分组统计
        const logsByUser = {};
        (logsRes.data || []).forEach(l => {
          if (!logsByUser[l.user_id]) logsByUser[l.user_id] = [];
          logsByUser[l.user_id].push(l);
        });

        const quizByUser = {};
        (quizRes.data || []).forEach(q => {
          if (!quizByUser[q.user_id]) quizByUser[q.user_id] = new Set();
          quizByUser[q.user_id].add(q.quiz_id);
        });

        const resReadByUser = {};
        (resReadRes.data || []).forEach(r => {
          if (!resReadByUser[r.user_id]) resReadByUser[r.user_id] = new Set();
          resReadByUser[r.user_id].add(r.resource_id);
        });

        const refByUser = {};
        (refRes.data || []).forEach(r => {
          refByUser[r.user_id] = (refByUser[r.user_id] || 0) + 1;
        });

        const qByUser = {};
        (qRes.data || []).forEach(q => {
          qByUser[q.user_id] = (qByUser[q.user_id] || 0) + 1;
        });

        // 有效期映射
        const expiryMap = {};
        (profilesRes.data || []).forEach(p => {
          expiryMap[p.id] = p.membership_expires_at;
        });

        // 计算每个学员的统计
        allStudents.forEach(s => {
          // 连续打卡天数（用本地日期）
          const logs = logsByUser[s.user_id] || [];
          const dateSet = new Set(logs.map(l => {
            const d = new Date(l.created_at);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          }));
          let streak = 0;
          const today = new Date();
          for (let i = 0; i < 365; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if (dateSet.has(ds)) streak++;
            else if (i > 0) break;
          }
          s.streak = streak;
          s.totalCheckins = dateSet.size;

          // 最后活跃时间
          if (logs.length > 0) {
            const lastLog = logs.reduce((a, b) => new Date(a.created_at) > new Date(b.created_at) ? a : b);
            s.lastActive = lastLog.created_at;
            const diffDays = Math.floor((today - new Date(lastLog.created_at)) / (1000 * 60 * 60 * 24));
            s.lastActiveText = diffDays === 0 ? '今天' : diffDays + '天前';
            s.lastActiveColor = diffDays >= 14 ? 'text-red-500' : diffDays >= 7 ? 'text-orange-500' : 'text-green-500';
          } else {
            s.lastActive = null;
            s.lastActiveText = '从未';
            s.lastActiveColor = 'text-gray-400';
          }

          // 有效期
          s.membershipExpiresAt = expiryMap[s.user_id] || null;
          if (s.membershipExpiresAt) {
            const expiryDate = new Date(s.membershipExpiresAt);
            const daysToExpiry = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
            s.expiryText = expiryDate.toLocaleDateString('zh-CN');
            s.expiryColor = daysToExpiry < 0 ? 'text-red-600' : daysToExpiry <= 60 ? 'text-yellow-600' : 'text-green-600';
          } else {
            s.expiryText = '永久';
            s.expiryColor = 'text-green-600';
          }

          // 最后打卡距今天数
          if (logs.length > 0) {
            const lastLog = logs.reduce((a, b) => new Date(a.created_at) > new Date(b.created_at) ? a : b);
            const lastDate = new Date(lastLog.created_at);
            const diffTime = today - lastDate;
            s.daysSinceLastCheckin = Math.floor(diffTime / (1000 * 60 * 60 * 24));
          } else {
            s.daysSinceLastCheckin = 999; // 从未打卡
          }

          // 测验完成数
          s.quizCount = (quizByUser[s.user_id] || new Set()).size;

          // 资源阅读数
          s.resourceCount = (resReadByUser[s.user_id] || new Set()).size;

          // 心得数（只算有内容的）
          s.reflectionCount = refByUser[s.user_id] || 0;

          // 提问数
          s.questionCount = qByUser[s.user_id] || 0;

          // === 预警计算 ===
          s.alerts = {};

          // 取学员所在班级中开学最早的日期
          let earliestStart = null;
          s.classIds.forEach(cid => {
            const cls = allClasses.find(c => c.id == cid);
            if (cls && cls.start_date) {
              const sd = new Date(cls.start_date);
              if (!earliestStart || sd < earliestStart) earliestStart = sd;
            }
          });
          s.earliestStart = earliestStart;

          // 1. 长期未打卡：≥14天
          if (s.daysSinceLastCheckin >= 14) {
            s.alerts.noCheckin = { days: s.daysSinceLastCheckin };
          }

          // 2. 测验未完成：每14天至少3题
          if (earliestStart) {
            const daysSinceStart = Math.floor((today - earliestStart) / (1000 * 60 * 60 * 24));
            const expectedQuizzes = Math.floor(daysSinceStart / 14) * 3;
            s.expectedQuizzes = expectedQuizzes;
            if (expectedQuizzes >= 3 && s.quizCount < expectedQuizzes) {
              s.alerts.noQuiz = { actual: s.quizCount, expected: expectedQuizzes };
            }
          }

          // 3. 心得未写：每14天至少1篇
          if (earliestStart) {
            const daysSinceStart = Math.floor((today - earliestStart) / (1000 * 60 * 60 * 24));
            const expectedReflections = Math.floor(daysSinceStart / 14) * 1;
            s.expectedReflections = expectedReflections;
            if (expectedReflections >= 1 && s.reflectionCount < expectedReflections) {
              s.alerts.noReflection = { actual: s.reflectionCount, expected: expectedReflections };
            }
          }

          // 过滤掉已忽略的预警
          const userIgnored = ignoredAlerts[s.user_id] || {};
          s.activeAlerts = {};
          Object.keys(s.alerts).forEach(key => {
            if (!userIgnored[key]) {
              s.activeAlerts[key] = s.alerts[key];
            }
          });
          s.hasAlert = Object.keys(s.activeAlerts).length > 0;
        });

        // 更新概览统计
        document.getElementById('total-students').textContent = allStudents.length;
        const avgStreak = allStudents.length ? Math.round(allStudents.reduce((sum, s) => sum + s.streak, 0) / allStudents.length) : 0;
        document.getElementById('avg-streak').textContent = avgStreak;

        renderTable();
      } catch (e) {
        console.error('加载数据失败:', e);
        document.getElementById('student-table-body').innerHTML = '<tr><td colspan="9" class="px-6 py-12 text-center text-red-400">加载失败：' + e.message + '</td></tr>';
      }
    }

    function renderTable() {
      const filterClassId = document.getElementById('class-filter').value;
      let filtered = allStudents;

      if (filterClassId) {
        filtered = allStudents.filter(s => s.classIds.includes(parseInt(filterClassId)) || s.classIds.includes(filterClassId));
      }

      // 只看需要关注
      if (showAlertOnly) {
        filtered = filtered.filter(s => s.hasAlert);
      }

      if (filtered.length === 0) {
        const msg = showAlertOnly ? '没有需要关注的学员' : (filterClassId ? '该班级暂无学员' : '暂无学员');
        document.getElementById('student-table-body').innerHTML = `<tr><td colspan="10" class="px-6 py-12 text-center text-gray-400">${msg}</td></tr>`;
        return;
      }

      // 按是否有预警 + 连续打卡降序排列
      filtered.sort((a, b) => {
        if (a.hasAlert !== b.hasAlert) return a.hasAlert ? -1 : 1;
        return b.streak - a.streak;
      });

      const tbody = document.getElementById('student-table-body');
      tbody.innerHTML = filtered.map(s => {
        const streakColor = s.streak >= 7 ? 'text-orange-500 font-bold' : s.streak >= 3 ? 'text-orange-400' : 'text-gray-600';
        const rowBg = s.hasAlert ? 'bg-red-50/30' : '';

        // 预警标签
        let alertBadges = '';
        if (s.activeAlerts.noCheckin) {
          alertBadges += `<span class="inline-flex items-center px-1.5 py-0.5 text-xs bg-red-100 text-red-600 rounded-full mr-1" title="已${s.activeAlerts.noCheckin.days}天未打卡">🔴${s.activeAlerts.noCheckin.days}天</span>`;
        }
        if (s.activeAlerts.noQuiz) {
          alertBadges += `<span class="inline-flex items-center px-1.5 py-0.5 text-xs bg-orange-100 text-orange-600 rounded-full mr-1" title="应完成${s.activeAlerts.noQuiz.expected}题，实际${s.activeAlerts.noQuiz.actual}题">🟠${s.activeAlerts.noQuiz.actual}/${s.activeAlerts.noQuiz.expected}</span>`;
        }
        if (s.activeAlerts.noReflection) {
          alertBadges += `<span class="inline-flex items-center px-1.5 py-0.5 text-xs bg-yellow-100 text-yellow-600 rounded-full mr-1" title="应完成${s.activeAlerts.noReflection.expected}篇，实际${s.activeAlerts.noReflection.actual}篇">🟡${s.activeAlerts.noReflection.actual}/${s.activeAlerts.noReflection.expected}</span>`;
        }

        // 忽略按钮（有预警时显示）
        let ignoreBtn = '';
        if (s.hasAlert) {
          ignoreBtn = `<div class="flex flex-col gap-1">
            <a href="student-detail.html?user_id=${s.user_id}&class_id=${s.classIds[0]}" class="text-blue-500 hover:text-blue-700 text-sm font-medium">详情</a>
            <button onclick="ignoreAlert('${s.user_id}', '${Object.keys(s.activeAlerts)[0]}')" class="text-gray-400 hover:text-gray-600 text-xs">忽略</button>
          </div>`;
        } else {
          ignoreBtn = `<a href="student-detail.html?user_id=${s.user_id}&class_id=${s.classIds[0]}" class="text-blue-500 hover:text-blue-700 text-sm font-medium">详情</a>`;
        }

        return `<tr class="hover:bg-gray-50 transition ${rowBg}">
          <td class="px-6 py-4">
            <div class="flex items-center">
              <div class="w-9 h-9 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-medium text-sm mr-3">${s.name.charAt(0)}</div>
              <div>
                <span class="text-sm font-medium text-gray-800">${escapeHtml(s.name)}</span>
                ${alertBadges ? `<div class="mt-1">${alertBadges}</div>` : ''}
              </div>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500">${s.classes.map(escapeHtml).join('、')}</td>
          <td class="px-6 py-4 text-center text-sm ${s.activeAlerts.noCheckin ? 'text-red-600 font-bold' : streakColor}">${s.streak} 天</td>
          <td class="px-6 py-4 text-center text-sm text-gray-600">${s.totalCheckins} 天</td>
          <td class="px-6 py-4 text-center text-sm ${s.lastActiveColor || 'text-gray-600'}">${s.lastActiveText || '-'}</td>
          <td class="px-6 py-4 text-center text-sm ${s.activeAlerts.noQuiz ? 'text-orange-600 font-bold' : 'text-gray-600'}">${s.quizCount} 份</td>
          <td class="px-6 py-4 text-center text-sm text-gray-600">${s.resourceCount} 个</td>
          <td class="px-6 py-4 text-center text-sm ${s.activeAlerts.noReflection ? 'text-yellow-600 font-bold' : 'text-gray-600'}">${s.reflectionCount} 篇</td>
          <td class="px-6 py-4 text-center text-sm ${s.expiryColor || 'text-gray-600'}">${s.expiryText || '-'}</td>
          <td class="px-6 py-4 text-center">${ignoreBtn}</td>
        </tr>`;
      }).join('');

      updateAlertSection();
    }

    // 更新预警区
    function updateAlertSection() {
      const alertStudents = allStudents.filter(s => s.hasAlert);
      const noCheckinCount = allStudents.filter(s => s.activeAlerts.noCheckin).length;
      const noQuizCount = allStudents.filter(s => s.activeAlerts.noQuiz).length;
      const noReflectionCount = allStudents.filter(s => s.activeAlerts.noReflection).length;

      // 统计已忽略数量
      let ignoredCount = 0;
      Object.values(ignoredAlerts).forEach(alerts => {
        ignoredCount += Object.keys(alerts).length;
      });

      const section = document.getElementById('alert-section');
      if (alertStudents.length === 0 && ignoredCount === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      document.getElementById('alert-total').textContent = `${alertStudents.length}人`;
      document.getElementById('alert-no-checkin').textContent = noCheckinCount;
      document.getElementById('alert-no-quiz').textContent = noQuizCount;
      document.getElementById('alert-no-reflection').textContent = noReflectionCount;

      const ignoredBtn = document.getElementById('ignored-btn');
      if (ignoredCount > 0) {
        ignoredBtn.classList.remove('hidden');
        ignoredBtn.textContent = `已忽略 ${ignoredCount} 项`;
      } else {
        ignoredBtn.classList.add('hidden');
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function exportExcel() {
      const filterClassId = document.getElementById('class-filter').value;
      let filtered = allStudents;
      if (filterClassId) {
        filtered = allStudents.filter(s => s.classIds.includes(parseInt(filterClassId)) || s.classIds.includes(filterClassId));
      }
      if (filtered.length === 0) {
        alert('没有可导出的数据');
        return;
      }

      // 准备数据
      const headers = ['姓名', '班级', '连续打卡(天)', '累计打卡(天)', '测验完成(份)', '资源阅读(个)', '心得(篇)', '提问(次)'];
      const rows = filtered.map(s => [
        s.name,
        s.classes.join('、'),
        s.streak,
        s.totalCheckins,
        s.quizCount,
        s.resourceCount,
        s.reflectionCount,
        s.questionCount
      ]);

      // 创建工作簿
      const wb = XLSX.utils.book_new();
      
      // 创建标题行和数据
      const titleRow = ['学员学习状态报表'];
      const dateRow = [`导出时间：${new Date().toLocaleString('zh-CN')}`];
      const emptyRow = [];
      const aoa = [titleRow, dateRow, emptyRow, headers, ...rows];
      
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      // 设置列宽
      ws['!cols'] = [
        { wch: 12 }, // 姓名
        { wch: 25 }, // 班级
        { wch: 14 }, // 连续打卡
        { wch: 14 }, // 累计打卡
        { wch: 14 }, // 测验完成
        { wch: 14 }, // 资源阅读
        { wch: 10 }, // 心得
        { wch: 10 }  // 提问
      ];

      // 合并标题行单元格
      ws['!merges'] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 7 } }, // 标题行合并
        { s: { r: 1, c: 0 }, e: { r: 1, c: 7 } }  // 日期行合并
      ];

      // 设置单元格样式（需要xlsx-js-style库支持，这里用基础格式）
      // 标题行样式
      if (ws['A1']) {
        ws['A1'].s = {
          font: { bold: true, size: 16, color: { rgb: '1F4E79' } },
          alignment: { horizontal: 'center', vertical: 'center' },
          fill: { fgColor: { rgb: 'D6E4F0' } }
        };
      }
      // 日期行样式
      if (ws['A2']) {
        ws['A2'].s = {
          font: { size: 10, color: { rgb: '666666' } },
          alignment: { horizontal: 'right' }
        };
      }
      // 表头行样式（第4行，索引3）
      const headerRowIndex = 3;
      for (let c = 0; c < headers.length; c++) {
        const cellRef = XLSX.utils.encode_cell({ r: headerRowIndex, c });
        if (ws[cellRef]) {
          ws[cellRef].s = {
            font: { bold: true, color: { rgb: 'FFFFFF' } },
            alignment: { horizontal: 'center', vertical: 'center' },
            fill: { fgColor: { rgb: '4472C4' } }
          };
        }
      }

      // 数据行条件格式（连续打卡<7天标红）
      rows.forEach((row, idx) => {
        const rowIndex = headerRowIndex + 1 + idx;
        const streak = row[2]; // 连续打卡
        if (streak < 7) {
          for (let c = 0; c < headers.length; c++) {
            const cellRef = XLSX.utils.encode_cell({ r: rowIndex, c });
            if (ws[cellRef]) {
              ws[cellRef].s = {
                font: { color: { rgb: 'C00000' } },
                fill: { fgColor: { rgb: 'FCE4E4' } }
              };
            }
          }
        }
      });

      // 添加到工作簿
      XLSX.utils.book_append_sheet(wb, ws, '学员学习状态');

      // 下载文件
      const date = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `学员学习状态_${date}.xlsx`);
    }
  </script>
</body>
</html>
