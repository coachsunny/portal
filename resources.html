<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源管理 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 页面标题 -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800">📦 全局资源库</h1>
      <p class="text-gray-500 mt-1">所有班级共享的资源，上传一次可被多个章节引用</p>
    </div>

    <!-- 工具栏 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex flex-wrap items-center gap-3">
      <div class="flex-1 min-w-[200px]">
        <input type="text" id="resource-search" oninput="renderResourceList()" placeholder="搜索资源..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <select id="filter-scope" onchange="renderResourceList()" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
        <option value="all">全部范围</option>
        <option value="global">仅全局资源</option>
        <option value="class">仅班级专属</option>
      </select>
      <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center">
        <span class="mr-2">➕</span> 上传新资源
      </button>
    </div>

    <!-- 资源列表 -->
    <div id="resource-list" class="space-y-3"></div>
    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-gray-100">
      <p class="text-5xl mb-4">📂</p>
      <p class="text-gray-500">还没有资源</p>
      <p class="text-gray-400 text-sm mt-1">点击右上角「上传新资源」开始</p>
    </div>
  </main>

  <!-- 上传/编辑资源弹窗 -->
  <div id="upload-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800" id="upload-modal-title">上传新资源</h3>
      </div>
      <div class="p-6 space-y-4">
        <!-- 资源类型 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">资源类型</label>
          <div class="flex space-x-3">
            <label id="type-pdf-label" onclick="switchResourceType('pdf')" class="flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition">
              <input type="radio" name="resource-type" value="pdf" checked class="hidden">
              <span class="text-sm font-medium text-blue-700">📄 PDF 文档</span>
            </label>
            <label id="type-video-label" onclick="switchResourceType('video')" class="flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition">
              <input type="radio" name="resource-type" value="video" class="hidden">
              <span class="text-sm font-medium text-gray-600">🎬 视频链接</span>
            </label>
          </div>
        </div>

        <!-- 资源范围 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">资源范围</label>
          <div class="flex space-x-3">
            <label id="scope-global-label" onclick="switchScope('global')" class="flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition">
              <input type="radio" name="resource-scope" value="global" checked class="hidden">
              <span class="text-sm font-medium text-blue-700">🌐 全局共享</span>
            </label>
            <label id="scope-class-label" onclick="switchScope('class')" class="flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition">
              <input type="radio" name="resource-scope" value="class" class="hidden">
              <span class="text-sm font-medium text-gray-600">🏫 班级专属</span>
            </label>
          </div>
        </div>

        <!-- 班级选择（仅班级专属时显示） -->
        <div id="class-select-area" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">选择班级</label>
          <select id="resource-class-id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
            <option value="">请选择班级</option>
          </select>
        </div>

        <!-- 标题 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">资源标题 *</label>
          <input type="text" id="resource-title" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例如：教练入门讲义">
        </div>

        <!-- PDF 上传区 -->
        <div id="pdf-upload-area">
          <label class="block text-sm font-medium text-gray-700 mb-2">PDF 文件</label>
          <label class="flex items-center justify-center w-full h-24 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
            <input type="file" id="pdf-file" accept=".pdf" onchange="onPdfSelected(event)" class="hidden">
            <span id="pdf-file-name" class="text-sm text-gray-500">点击选择 PDF 文件（最大 10MB）</span>
          </label>
        </div>

        <!-- 视频链接区 -->
        <div id="video-link-area" class="hidden space-y-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">网盘链接 *</label>
            <input type="text" id="video-url" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="粘贴百度网盘等分享链接">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">提取码</label>
            <input type="text" id="video-code" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="选填">
          </div>
        </div>

        <!-- 描述 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">描述（选填）</label>
          <textarea id="resource-desc" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="简要描述这个资源"></textarea>
        </div>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeUploadModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
        <button onclick="saveResource()" id="save-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">保存到资源库</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let allResources = [];
    let allClasses = [];
    let resourceStats = {};
    let selectedPdfFile = null;
    let editingResourceId = null;

    window.addEventListener('load', async () => {
      currentSession = await requireTeacher();
      if (!currentSession) return;
      renderNavbar(currentSession, 'resources');
      await loadClasses();
      await loadResources();
    });

    async function loadClasses() {
      try {
        const { data: classes, error } = await sb.from('classes').select('id, name').order('name');
        if (error) throw error;
        allClasses = classes || [];
        const select = document.getElementById('resource-class-id');
        select.innerHTML = '<option value="">请选择班级</option>' + allClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      } catch (e) { console.error('加载班级失败:', e); }
    }

    async function loadResources() {
      try {
        const { data: resources, error } = await sb.from('resources').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        allResources = resources || [];

        // 查询资源使用统计
        if (allResources.length > 0) {
          const resourceIds = allResources.map(r => r.id);
          const { data: reads } = await sb.from('resource_reads').select('resource_id, user_id').in('resource_id', resourceIds);
          // 统计每个资源的查看次数和查看人数
          resourceStats = {};
          (reads || []).forEach(read => {
            if (!resourceStats[read.resource_id]) {
              resourceStats[read.resource_id] = { count: 0, users: new Set() };
            }
            resourceStats[read.resource_id].count++;
            resourceStats[read.resource_id].users.add(read.user_id);
          });
        }

        renderResourceList();
      } catch (e) { console.error('加载资源失败:', e); alert('加载资源失败：' + e.message); }
    }

    function renderResourceList() {
      const container = document.getElementById('resource-list');
      const empty = document.getElementById('empty-state');
      const keyword = document.getElementById('resource-search').value.toLowerCase();
      const scopeFilter = document.getElementById('filter-scope').value;

      let filtered = allResources.filter(r => !keyword || r.title.toLowerCase().includes(keyword));
      if (scopeFilter === 'global') filtered = filtered.filter(r => !r.class_id);
      if (scopeFilter === 'class') filtered = filtered.filter(r => r.class_id);

      if (filtered.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');

      container.innerHTML = filtered.map(r => {
        const cls = allClasses.find(c => c.id === r.class_id);
        const scopeLabel = r.class_id
          ? `<span class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded">${escapeHtml(cls ? cls.name : '班级专属')}</span>`
          : '<span class="text-xs px-1.5 py-0.5 bg-green-100 text-green-600 rounded">全局</span>';
        // 资源使用统计
        const stats = resourceStats[r.id];
        const statsLabel = stats
          ? `<span class="text-xs px-1.5 py-0.5 bg-purple-100 text-purple-600 rounded ml-1" title="查看${stats.count}次，${stats.users.size}人看过">👁 ${stats.users.size}人 / ${stats.count}次</span>`
          : '';
        return `
        <div class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-xl hover:shadow-sm transition">
          <div class="flex items-center flex-1 min-w-0">
            <span class="text-2xl mr-4 flex-shrink-0">${r.type === 'pdf' ? '📄' : '🎬'}</span>
            <div class="min-w-0">
              <p class="font-medium text-gray-800 truncate">${escapeHtml(r.title)} ${scopeLabel}${statsLabel}</p>
              <p class="text-xs text-gray-400 truncate mt-1">${escapeHtml(r.description || (r.type === 'pdf' ? 'PDF文档' : '视频 · 提取码: ' + (r.extraction_code || '无')))}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2 flex-shrink-0 ml-4">
            ${r.type === 'pdf' && r.file_url ? `<a href="${r.file_url}" target="_blank" class="px-3 py-1.5 text-sm text-blue-600 hover:bg-blue-50 rounded-lg transition">查看</a>` : ''}
            ${r.type === 'video' && r.file_url ? `<button onclick="copyVideoLink('${r.file_url}', '${r.extraction_code || ''}')" class="px-3 py-1.5 text-sm text-blue-600 hover:bg-blue-50 rounded-lg transition">复制链接</button>` : ''}
            <button onclick="editResource(${r.id})" class="px-2 py-1.5 text-gray-500 hover:bg-gray-100 rounded-lg transition text-sm" title="编辑">✏️</button>
            <button onclick="deleteResource(${r.id})" class="px-2 py-1.5 text-red-500 hover:bg-red-50 rounded-lg transition text-sm" title="删除">🗑️</button>
          </div>
        </div>`;
      }).join('');
    }

    function openUploadModal() {
      editingResourceId = null;
      selectedPdfFile = null;
      document.getElementById('upload-modal-title').textContent = '上传新资源';
      document.getElementById('save-btn').textContent = '保存到资源库';
      document.getElementById('resource-title').value = '';
      document.getElementById('resource-desc').value = '';
      document.getElementById('pdf-file').value = '';
      document.getElementById('pdf-file-name').textContent = '点击选择 PDF 文件（最大 10MB）';
      document.getElementById('video-url').value = '';
      document.getElementById('video-code').value = '';
      switchResourceType('pdf');
      document.getElementById('upload-modal').classList.remove('hidden');
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').classList.add('hidden');
      selectedPdfFile = null;
      editingResourceId = null;
    }

    function switchResourceType(type) {
      const pl = document.getElementById('type-pdf-label'), vl = document.getElementById('type-video-label');
      const pa = document.getElementById('pdf-upload-area'), va = document.getElementById('video-link-area');
      if (type === 'pdf') {
        pl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        vl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        pl.querySelector('input').checked = true;
        pa.classList.remove('hidden'); va.classList.add('hidden');
      } else {
        vl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        pl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        vl.querySelector('input').checked = true;
        va.classList.remove('hidden'); pa.classList.add('hidden');
      }
    }

    function switchScope(scope) {
      const gl = document.getElementById('scope-global-label'), cl = document.getElementById('scope-class-label');
      const classArea = document.getElementById('class-select-area');
      if (scope === 'global') {
        gl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        cl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        gl.querySelector('input').checked = true;
        classArea.classList.add('hidden');
      } else {
        cl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        gl.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        cl.querySelector('input').checked = true;
        classArea.classList.remove('hidden');
      }
    }

    function onPdfSelected(e) {
      const f = e.target.files[0];
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) { alert('文件大小不能超过 10MB'); e.target.value = ''; return; }
      selectedPdfFile = f;
      document.getElementById('pdf-file-name').textContent = '✅ ' + f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';
    }

    async function saveResource() {
      const title = document.getElementById('resource-title').value.trim();
      const type = document.querySelector('input[name="resource-type"]:checked').value;
      const description = document.getElementById('resource-desc').value.trim();
      const scope = document.querySelector('input[name="resource-scope"]:checked').value;
      const classId = document.getElementById('resource-class-id').value;

      if (!title) { alert('请输入资源标题'); return; }
      if (scope === 'class' && !classId) { alert('请选择班级'); return; }

      const btn = document.getElementById('save-btn');
      btn.disabled = true; btn.textContent = '保存中...';

      try {
        let fileUrl = '', code = '';
        if (type === 'pdf') {
          if (editingResourceId) {
            // 编辑模式：如果没有重新选择文件，保留原链接
            if (!selectedPdfFile) {
              const existing = allResources.find(r => r.id === editingResourceId);
              fileUrl = existing ? existing.file_url : '';
            } else {
              const ext = selectedPdfFile.name.split('.').pop() || 'pdf';
              const path = `global/${Date.now()}.${ext}`;
              const { error: ue } = await sb.storage.from('resources').upload(path, selectedPdfFile);
              if (ue) throw ue;
              const { data: urlData } = sb.storage.from('resources').getPublicUrl(path);
              fileUrl = urlData.publicUrl;
            }
          } else {
            if (!selectedPdfFile) { alert('请选择 PDF 文件'); btn.disabled = false; btn.textContent = '保存到资源库'; return; }
            const ext = selectedPdfFile.name.split('.').pop() || 'pdf';
            const path = `global/${Date.now()}.${ext}`;
            const { error: ue } = await sb.storage.from('resources').upload(path, selectedPdfFile);
            if (ue) throw ue;
            const { data: urlData } = sb.storage.from('resources').getPublicUrl(path);
            fileUrl = urlData.publicUrl;
          }
        } else {
          fileUrl = document.getElementById('video-url').value.trim();
          code = document.getElementById('video-code').value.trim();
          if (!fileUrl) { alert('请输入网盘链接'); btn.disabled = false; btn.textContent = '保存到资源库'; return; }
        }

        const resourceData = { type, title, file_url: fileUrl, extraction_code: code, description };
        if (scope === 'class') resourceData.class_id = parseInt(classId);
        else resourceData.class_id = null;

        if (editingResourceId) {
          const { error } = await sb.from('resources').update(resourceData).eq('id', editingResourceId);
          if (error) throw error;
        } else {
          const { error } = await sb.from('resources').insert(resourceData);
          if (error) throw error;
        }

        closeUploadModal();
        await loadResources();
      } catch (e) { alert('保存失败：' + e.message); }
      finally { btn.disabled = false; btn.textContent = editingResourceId ? '保存修改' : '保存到资源库'; }
    }

    async function editResource(id) {
      const r = allResources.find(x => x.id === id);
      if (!r) return;
      editingResourceId = id;
      selectedPdfFile = null;
      document.getElementById('upload-modal-title').textContent = '编辑资源';
      document.getElementById('save-btn').textContent = '保存修改';
      document.getElementById('resource-title').value = r.title;
      document.getElementById('resource-desc').value = r.description || '';
      document.getElementById('pdf-file').value = '';
      document.getElementById('pdf-file-name').textContent = r.type === 'pdf' ? '不修改则保留原文件，点击选择新文件' : '点击选择 PDF 文件（最大 10MB）';
      document.getElementById('video-url').value = r.file_url || '';
      document.getElementById('video-code').value = r.extraction_code || '';
      switchResourceType(r.type);
      if (r.class_id) {
        switchScope('class');
        document.getElementById('resource-class-id').value = r.class_id;
      } else {
        switchScope('global');
      }
      document.getElementById('upload-modal').classList.remove('hidden');
    }

    async function deleteResource(id) {
      if (!confirm('确定要从资源库删除这个资源吗？所有章节对该资源的引用也会被删除，且无法恢复。')) return;
      try {
        const { error } = await sb.from('resources').delete().eq('id', id);
        if (error) throw error;
        await loadResources();
      } catch (e) { alert('删除失败：' + e.message); }
    }

    function copyVideoLink(url, code) {
      const copyUrl = code ? `${url}?pwd=${code}` : url;
      navigator.clipboard.writeText(copyUrl).then(() => {
        alert('链接已复制到剪贴板\n\n' + copyUrl + (code ? '\n\n提取码：' + code + '（已自动带入网址）' : ''));
      }).catch(() => { alert('复制失败，请手动复制：\n' + copyUrl); });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
