<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的学习档案 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      .print-page { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 20px !important; }
    }
    .print-page {
      background: white;
      max-width: 800px;
      margin: 40px auto;
      padding: 60px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- 顶部操作栏 -->
  <div class="no-print bg-white border-b sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <button onclick="window.close()" class="text-gray-500 hover:text-gray-700 text-sm">← 返回</button>
      <h1 class="text-lg font-semibold text-gray-800">学习档案预览</h1>
      <button onclick="window.print()" class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition">🖨️ 打印 / 保存PDF</button>
    </div>
  </div>

  <div id="loading" class="text-center py-20 text-gray-400">
    <p class="text-4xl mb-4">📄</p>
    <p>正在生成学习档案...</p>
  </div>

  <div id="archive-content" class="print-page hidden">
    <!-- 档案头部 -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">学习档案</h1>
      <p class="text-gray-500">自牧平施教练班</p>
      <p class="text-sm text-gray-400 mt-2" id="archive-date"></p>
    </div>

    <!-- 学员基本信息 -->
    <div class="mb-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">学员信息</h2>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><span class="text-gray-500">姓名：</span><span id="archive-name" class="text-gray-800 font-medium"></span></div>
        <div><span class="text-gray-500">班级：</span><span id="archive-class" class="text-gray-800 font-medium"></span></div>
        <div><span class="text-gray-500">加入时间：</span><span id="archive-join" class="text-gray-800"></span></div>
        <div><span class="text-gray-500">档案生成：</span><span id="archive-gen" class="text-gray-800"></span></div>
      </div>
    </div>

    <!-- 学习统计 -->
    <div class="mb-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">学习统计</h2>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-orange-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-orange-500" id="stat-streak">0</p>
          <p class="text-xs text-gray-500 mt-1">连续打卡(天)</p>
        </div>
        <div class="bg-blue-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-blue-500" id="stat-checkins">0</p>
          <p class="text-xs text-gray-500 mt-1">累计打卡(天)</p>
        </div>
        <div class="bg-green-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-green-500" id="stat-quiz-rate">0%</p>
          <p class="text-xs text-gray-500 mt-1">测验完成率</p>
        </div>
        <div class="bg-purple-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-purple-500" id="stat-resource">0</p>
          <p class="text-xs text-gray-500 mt-1">资源阅读(个)</p>
        </div>
        <div class="bg-pink-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-pink-500" id="stat-reflection">0</p>
          <p class="text-xs text-gray-500 mt-1">心得撰写(篇)</p>
        </div>
        <div class="bg-amber-50 rounded-lg p-4 text-center">
          <p class="text-2xl font-bold text-amber-500" id="stat-question">0</p>
          <p class="text-xs text-gray-500 mt-1">提问次数</p>
        </div>
      </div>
    </div>

    <!-- 期末评价 -->
    <div class="mb-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">期末评价</h2>
      <div class="bg-gray-50 rounded-lg p-5">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm text-gray-500">成绩判定</span>
          <span id="archive-passed" class="px-3 py-1 rounded-full text-sm font-medium"></span>
        </div>
        <div class="mb-2">
          <span class="text-sm text-gray-500">老师评语</span>
        </div>
        <p class="text-gray-700 leading-relaxed whitespace-pre-wrap" id="archive-comment"></p>
      </div>
    </div>

    <!-- 学习心得 -->
    <div class="mb-8" id="section-reflections">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">学习心得</h2>
      <div id="archive-reflections" class="space-y-4"></div>
    </div>

    <!-- 测验记录 -->
    <div class="mb-8" id="section-quizzes">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">测验记录</h2>
      <div id="archive-quizzes" class="space-y-3"></div>
    </div>

    <!-- 提问记录 -->
    <div class="mb-8" id="section-questions">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">提问记录</h2>
      <div id="archive-questions" class="space-y-3"></div>
    </div>

    <!-- 打卡记录 -->
    <div class="mb-8" id="section-checkins">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">打卡记录</h2>
      <div id="archive-checkins" class="text-sm text-gray-600"></div>
    </div>

    <!-- 页脚 -->
    <div class="mt-12 pt-6 border-t border-gray-200 text-center text-xs text-gray-400">
      <p>本档案由自牧平施教练班系统自动生成</p>
      <p class="mt-1">生成时间：<span id="archive-footer-time"></span></p>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function init() {
      const session = await requireStudent();
      if (!session) return;

      const urlParams = new URLSearchParams(window.location.search);
      const classId = urlParams.get('class_id');
      if (!classId) {
        document.getElementById('loading').innerHTML = '<p class="text-red-400">缺少班级参数</p>';
        return;
      }

      try {
        // 验证是否有评价
        const { data: evalData, error: evalErr } = await sb
          .from('student_evaluations')
          .select('*')
          .eq('user_id', session.user.id)
          .eq('class_id', classId)
          .maybeSingle();
        if (evalErr) throw evalErr;
        if (!evalData || evalData.is_passed === null) {
          document.getElementById('loading').innerHTML = '<p class="text-red-400">老师尚未完成期末评价，暂无法生成档案</p>';
          return;
        }

        // 加载班级信息
        const { data: classData, error: classErr } = await sb
          .from('classes')
          .select('name, created_at')
          .eq('id', classId)
          .single();
        if (classErr) throw classErr;

        // 加载学员班级加入时间
        const { data: memberData } = await sb
          .from('class_members')
          .select('joined_at')
          .eq('user_id', session.user.id)
          .eq('class_id', classId)
          .maybeSingle();

        // 加载所有学习数据
        const [logsRes, quizSubRes, chaptersRes, resourcesRes, resReadRes, refRes, qRes] = await Promise.all([
          sb.from('study_logs').select('created_at').eq('user_id', session.user.id).eq('class_id', classId),
          sb.from('quiz_submissions').select('quiz_id, answer, submitted_at, score').eq('user_id', session.user.id).eq('class_id', classId),
          sb.from('chapters').select('id, title, class_id').eq('class_id', classId),
          sb.from('resources').select('id, title, chapter_id').eq('class_id', classId),
          sb.from('resource_reads').select('resource_id').eq('user_id', session.user.id).eq('class_id', classId),
          sb.from('chapter_reflections').select('chapter_id, content, created_at').eq('user_id', session.user.id).eq('class_id', classId),
          sb.from('questions').select('question, answer, created_at, answered_at').eq('user_id', session.user.id).eq('class_id', classId)
        ]);

        // 填充基本信息
        document.getElementById('archive-name').textContent = session.name;
        document.getElementById('archive-class').textContent = classData.name;
        document.getElementById('archive-join').textContent = memberData ? formatDate(memberData.joined_at) : '-';
        const now = new Date();
        const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
        document.getElementById('archive-date').textContent = dateStr;
        document.getElementById('archive-gen').textContent = dateStr;
        document.getElementById('archive-footer-time').textContent = now.toLocaleString('zh-CN');

        // 计算打卡统计
        const logs = logsRes.data || [];
        const dateSet = new Set(logs.map(l => {
          const d = new Date(l.created_at);
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }));
        let streak = 0;
        for (let i = 0; i < 365; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if (dateSet.has(ds)) streak++;
          else if (i > 0) break;
        }
        document.getElementById('stat-streak').textContent = streak;
        document.getElementById('stat-checkins').textContent = dateSet.size;

        // 测验完成率
        const chapters = chaptersRes.data || [];
        const chapterIds = chapters.map(c => c.id);
        const allQuizIds = new Set();
        // 这里简化处理，假设每个章节的测验数需要从quizzes表查询
        // 先统计已提交的测验数
        const submittedQuizIds = new Set((quizSubRes.data || []).map(q => q.quiz_id));
        document.getElementById('stat-quiz-rate').textContent = submittedQuizIds.size + '份';

        // 资源阅读
        const resources = resourcesRes.data || [];
        const readIds = new Set((resReadRes.data || []).map(r => r.resource_id));
        document.getElementById('stat-resource').textContent = `${readIds.size}/${resources.length}`;

        // 心得
        const reflections = refRes.data || [];
        document.getElementById('stat-reflection').textContent = reflections.length;

        // 提问
        const questions = qRes.data || [];
        document.getElementById('stat-question').textContent = questions.length;

        // 期末评价
        document.getElementById('archive-passed').textContent = evalData.is_passed ? '✅ 及格' : '❌ 不及格';
        document.getElementById('archive-passed').className = evalData.is_passed 
          ? 'px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-700'
          : 'px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-700';
        document.getElementById('archive-comment').textContent = evalData.teacher_comment || '暂无评语';

        // 学习心得列表
        const refContainer = document.getElementById('archive-reflections');
        if (reflections.length === 0) {
          document.getElementById('section-reflections').classList.add('hidden');
        } else {
          const chapterMap = {};
          chapters.forEach(c => chapterMap[c.id] = c.title);
          refContainer.innerHTML = reflections.map(r => `
            <div class="border border-gray-200 rounded-lg p-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">${escapeHtml(chapterMap[r.chapter_id] || '未知章节')}</span>
                <span class="text-xs text-gray-400">${formatDate(r.created_at)}</span>
              </div>
              <p class="text-sm text-gray-600 whitespace-pre-wrap">${escapeHtml(r.content)}</p>
            </div>
          `).join('');
        }

        // 测验记录
        const quizContainer = document.getElementById('archive-quizzes');
        const quizSubs = quizSubRes.data || [];
        if (quizSubs.length === 0) {
          document.getElementById('section-quizzes').classList.add('hidden');
        } else {
          quizContainer.innerHTML = quizSubs.map(q => `
            <div class="flex justify-between items-center py-2 border-b border-gray-100">
              <span class="text-sm text-gray-700">测验 #${q.quiz_id}</span>
              <div class="flex items-center gap-4">
                <span class="text-xs ${q.score === 1 ? 'text-green-600' : 'text-red-600'}">${q.score === 1 ? '合格' : q.score === 0 ? '不合格' : '待批改'}</span>
                <span class="text-xs text-gray-400">${formatDate(q.submitted_at)}</span>
              </div>
            </div>
          `).join('');
        }

        // 提问记录
        const qContainer = document.getElementById('archive-questions');
        if (questions.length === 0) {
          document.getElementById('section-questions').classList.add('hidden');
        } else {
          qContainer.innerHTML = questions.map(q => `
            <div class="border border-gray-200 rounded-lg p-4">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">提问</span>
                <span class="text-xs text-gray-400">${formatDate(q.created_at)}</span>
              </div>
              <p class="text-sm text-gray-600 mb-3">${escapeHtml(q.question)}</p>
              ${q.answer ? `
                <div class="bg-blue-50 rounded p-3">
                  <p class="text-xs text-blue-600 font-medium mb-1">老师回复</p>
                  <p class="text-sm text-gray-700 whitespace-pre-wrap">${escapeHtml(q.answer)}</p>
                </div>
              ` : '<p class="text-xs text-gray-400">待回复</p>'}
            </div>
          `).join('');
        }

        // 打卡记录
        const checkinContainer = document.getElementById('archive-checkins');
        if (dateSet.size === 0) {
          document.getElementById('section-checkins').classList.add('hidden');
        } else {
          const sortedDates = Array.from(dateSet).sort().reverse();
          checkinContainer.innerHTML = `<p class="mb-2">共打卡 ${sortedDates.length} 天</p>
            <div class="flex flex-wrap gap-2">
              ${sortedDates.map(d => `<span class="px-2 py-1 bg-orange-50 text-orange-600 rounded text-xs">${d}</span>`).join('')}
            </div>`;
        }

        // 显示内容
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('archive-content').classList.remove('hidden');

      } catch (e) {
        console.error('生成档案失败:', e);
        document.getElementById('loading').innerHTML = '<p class="text-red-400">生成失败：' + e.message + '</p>';
      }
    })();

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
  </script>
</body>
</html>
