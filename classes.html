<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级管理 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 导航栏由 auth.js 动态渲染 -->

  <!-- 主内容区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 页面标题 -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">班级管理</h1>
        <p class="text-gray-500 mt-1">创建和管理你的教学班级</p>
      </div>
      <button onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center">
        <span class="mr-2">➕</span> 创建班级
      </button>
    </div>

    <!-- 快捷操作提示 -->
    <div id="tab-hint" class="hidden mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between">
      <p class="text-sm text-blue-700" id="tab-hint-text">请选择一个班级进行操作</p>
      <a href="classes.html" class="text-sm text-blue-600 hover:text-blue-800 font-medium">清除筛选</a>
    </div>

    <!-- 筛选标签 -->
    <div class="flex space-x-2 mb-6">
      <button onclick="filterClasses('active')" id="filter-active" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700">进行中</button>
      <button onclick="filterClasses('archived')" id="filter-archived" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">已归档</button>
      <button onclick="filterClasses('all')" id="filter-all" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">全部</button>
    </div>

    <!-- 班级列表 -->
    <div id="class-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 动态渲染 -->
    </div>

    <!-- 空状态 -->
    <div id="empty-state" class="hidden text-center py-16">
      <p class="text-5xl mb-4">📚</p>
      <p class="text-gray-500 text-lg">还没有班级</p>
      <p class="text-gray-400 text-sm mt-1">点击右上角「创建班级」开始</p>
    </div>
  </main>

  <!-- 创建/编辑班级弹窗 -->
  <div id="class-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800" id="modal-title">创建班级</h3>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">班级名称 *</label>
          <input type="text" id="class-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例如：2026年春季教练班">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">班级描述</label>
          <textarea id="class-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="简要介绍这个班级的内容和目标"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
          <input type="date" id="class-start-date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
        <button onclick="saveClass()" id="save-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">保存</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let editingClassId = null;
    let currentFilter = 'active';
    let targetTab = null;

    // 页面初始化
    window.addEventListener('load', async () => {
      currentSession = await requireTeacher();
      if (!currentSession) return;
      renderNavbar(currentSession, 'classes');

      // 读取URL参数
      const params = new URLSearchParams(window.location.search);
      targetTab = params.get('tab');
      if (targetTab) {
        const hintTexts = {
          resources: '请选择一个班级，进入后管理学习资源',
          quizzes: '请选择一个班级，进入后管理测验题目',
          questions: '请选择一个班级，进入后查看学员提问'
        };
        document.getElementById('tab-hint-text').textContent = hintTexts[targetTab] || '请选择一个班级进行操作';
        document.getElementById('tab-hint').classList.remove('hidden');
      }

      loadClasses();
    });

    // 加载班级列表
    async function loadClasses() {
      try {
        let query = sb.from('classes').select('*').eq('teacher_id', currentSession.user.id).order('created_at', { ascending: false });
        
        if (currentFilter !== 'all') {
          query = query.eq('status', currentFilter);
        }

        const { data: classes, error } = await query;
        if (error) throw error;

        // 获取每个班级的学员数量
        const classList = document.getElementById('class-list');
        const emptyState = document.getElementById('empty-state');

        if (!classes || classes.length === 0) {
          classList.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        // 批量查询每个班级的学员数
        const { data: members } = await sb.from('class_members').select('class_id');
        const memberCount = {};
        if (members) {
          members.forEach(m => {
            memberCount[m.class_id] = (memberCount[m.class_id] || 0) + 1;
          });
        }

        classList.innerHTML = classes.map(c => `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition">
            <div class="flex justify-between items-start mb-3">
              <h3 class="text-lg font-semibold text-gray-800">${escapeHtml(c.name)}</h3>
              <span class="px-2 py-1 text-xs rounded-full ${c.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                ${c.status === 'active' ? '进行中' : '已归档'}
              </span>
            </div>
            <p class="text-gray-500 text-sm mb-4 min-h-[40px]">${escapeHtml(c.description || '暂无描述')}</p>
            <div class="flex items-center text-sm text-gray-400 mb-4">
              <span class="mr-4">👥 ${memberCount[c.id] || 0} 名学员</span>
              ${c.start_date ? `<span>📅 ${c.start_date}</span>` : ''}
            </div>
            <div class="flex space-x-2">
              <a href="class-detail.html?id=${c.id}${targetTab ? '&tab=' + targetTab : ''}" class="flex-1 text-center px-3 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg text-sm font-medium transition">进入班级</a>
              <a href="class-detail.html?id=${c.id}&tab=resources" class="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm transition" title="管理资源">📚</a>
              <a href="class-detail.html?id=${c.id}&tab=quizzes" class="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm transition" title="管理测验">📝</a>
              <a href="class-detail.html?id=${c.id}&tab=questions" class="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm transition" title="学员提问">💬</a>
              <button onclick="editClass(${c.id})" class="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm transition" title="编辑">✏️</button>
              <button onclick="toggleArchive(${c.id}, '${c.status}')" class="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm transition" title="${c.status === 'active' ? '归档' : '恢复'}">
                ${c.status === 'active' ? '📦' : '♻️'}
              </button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('加载班级失败:', error);
        alert('加载班级失败：' + error.message);
      }
    }

    // 筛选
    function filterClasses(status) {
      currentFilter = status;
      // 更新按钮样式
      ['active', 'archived', 'all'].forEach(s => {
        const btn = document.getElementById('filter-' + s);
        if (s === status) {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700';
        } else {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100';
        }
      });
      loadClasses();
    }

    // 打开创建弹窗
    function openCreateModal() {
      editingClassId = null;
      document.getElementById('modal-title').textContent = '创建班级';
      document.getElementById('class-name').value = '';
      document.getElementById('class-description').value = '';
      document.getElementById('class-start-date').value = '';
      document.getElementById('class-modal').classList.remove('hidden');
    }

    // 编辑班级
    async function editClass(id) {
      try {
        const { data: cls, error } = await sb.from('classes').select('*').eq('id', id).single();
        if (error) throw error;

        editingClassId = id;
        document.getElementById('modal-title').textContent = '编辑班级';
        document.getElementById('class-name').value = cls.name || '';
        document.getElementById('class-description').value = cls.description || '';
        document.getElementById('class-start-date').value = cls.start_date || '';
        document.getElementById('class-modal').classList.remove('hidden');
      } catch (error) {
        alert('加载班级信息失败：' + error.message);
      }
    }

    // 关闭弹窗
    function closeModal() {
      document.getElementById('class-modal').classList.add('hidden');
      editingClassId = null;
    }

    // 保存班级
    async function saveClass() {
      const name = document.getElementById('class-name').value.trim();
      const description = document.getElementById('class-description').value.trim();
      const startDate = document.getElementById('class-start-date').value;

      if (!name) {
        alert('请输入班级名称');
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      try {
        if (editingClassId) {
          // 更新
          const { error } = await sb
            .from('classes')
            .update({ name, description, start_date: startDate || null })
            .eq('id', editingClassId);
          if (error) throw error;
        } else {
          // 创建
          const { error } = await sb
            .from('classes')
            .insert({ name, description, start_date: startDate || null, status: 'active', teacher_id: currentSession.user.id });
          if (error) throw error;
        }

        closeModal();
        loadClasses();
      } catch (error) {
        alert('保存失败：' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '保存';
      }
    }

    // 归档/恢复班级
    async function toggleArchive(id, currentStatus) {
      const action = currentStatus === 'active' ? '归档' : '恢复';
      if (!confirm(`确定要${action}这个班级吗？`)) return;

      try {
        const newStatus = currentStatus === 'active' ? 'archived' : 'active';
        const { error } = await sb.from('classes').update({ status: newStatus }).eq('id', id);
        if (error) throw error;
        loadClasses();
      } catch (error) {
        alert('操作失败：' + error.message);
      }
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
