<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习资源 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 班级选择器 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">选择班级</label>
      <select id="class-select" onchange="onClassChange()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
        <option value="">加载中...</option>
      </select>
    </div>

    <!-- 班级公告 -->
    <div id="announcement-section" class="hidden mb-6">
      <div class="bg-white rounded-xl shadow-sm border border-amber-200 p-5">
        <h2 class="text-base font-semibold text-gray-800 flex items-center mb-3">📢 班级公告</h2>
        <div id="announcement-list" class="space-y-3"></div>
        <div id="announcement-empty" class="hidden text-sm text-gray-400 text-center py-2">暂无公告</div>
      </div>
    </div>

    <!-- 标签切换 -->
    <div class="flex space-x-1 mb-6 bg-white rounded-xl p-1 border border-gray-100 w-fit">
      <button onclick="switchTab('resources')" id="tab-resources" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700">📚 学习资源</button>
      <button onclick="switchTab('quizzes')" id="tab-quizzes" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">📝 我的测验</button>
    </div>

    <!-- 班级信息 -->
    <div id="class-info" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h1 class="text-xl font-bold text-gray-800" id="class-name"></h1>
      <p class="text-gray-500 mt-1" id="class-description"></p>
    </div>

    <!-- 学习资源面板 -->
    <div id="panel-resources">
      <div id="resource-search-box" class="hidden mb-4">
        <div class="relative">
          <input type="text" id="resource-search-input" oninput="onResourceSearch()" placeholder="🔍 搜索资源标题或关键词..." class="w-full px-4 py-3 pl-10 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
        </div>
        <p id="search-result-count" class="text-xs text-gray-400 mt-2 hidden"></p>
      </div>
      <div id="resources-container">
        <div class="text-center py-12 text-gray-400">
          <p class="text-4xl mb-3">📚</p>
          <p>请选择班级查看学习资源</p>
        </div>
      </div>
      <div id="empty-resources" class="hidden text-center py-12 bg-white rounded-xl border border-gray-100">
        <p class="text-4xl mb-3">📖</p>
        <p class="text-gray-500">这个班级还没有学习资源</p>
      </div>
    </div>

    <!-- 测验面板 -->
    <div id="panel-quizzes" class="hidden">
      <div id="quizzes-container"></div>
      <div id="empty-quizzes" class="hidden text-center py-12 bg-white rounded-xl border border-gray-100">
        <p class="text-4xl mb-3">📝</p>
        <p class="text-gray-500">这个班级还没有测验题目</p>
      </div>
    </div>
  </main>

  <!-- 答题弹窗 -->
  <div id="quiz-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800">测验答题</h3>
        <p class="text-sm text-gray-500 mt-2" id="quiz-question-text"></p>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <div id="quiz-result-area" class="hidden mb-4"></div>
        <div id="quiz-answer-area">
          <label class="block text-sm font-medium text-gray-700 mb-2">你的答案</label>
          <textarea id="quiz-answer-input" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入你的答案..."></textarea>
        </div>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeQuizModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
        <button onclick="submitQuizAnswer()" id="quiz-submit-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">提交答案</button>
      </div>
    </div>
  </div>

  <!-- 提交确认弹窗 -->
  <div id="submit-confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800">确认提交答案？</h3>
      </div>
      <div class="p-6">
        <p class="text-sm text-gray-600">提交后老师将进行批改，确定要提交吗？</p>
        <p id="submit-confirm-warning" class="hidden text-sm text-amber-600 bg-amber-50 rounded-lg p-3 mt-3">⚠️ 你将覆盖之前已提交的答案。</p>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeSubmitConfirm()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">再看看</button>
        <button onclick="confirmSubmitQuiz()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">确认提交</button>
      </div>
    </div>
  </div>

  <!-- 心得编辑弹窗 -->
  <div id="reflection-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800" id="reflection-modal-title">学习心得</h3>
        <p class="text-sm text-gray-500 mt-1">记录你对本章内容的理解、感悟或收获</p>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <div class="mb-3">
          <p class="text-xs text-gray-400 mb-2">💡 不知道写什么？点击下方提示开始：</p>
          <div class="flex flex-wrap gap-2">
            <button onclick="insertReflectionPrompt('这一章最打动我的是，')" class="text-xs px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full hover:bg-amber-100 transition">这一章最打动我的是…</button>
            <button onclick="insertReflectionPrompt('让我联想到自己的经历，')" class="text-xs px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full hover:bg-amber-100 transition">让我联想到自己的经历…</button>
            <button onclick="insertReflectionPrompt('我打算这样应用，')" class="text-xs px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full hover:bg-amber-100 transition">我打算这样应用…</button>
          </div>
        </div>
        <textarea id="reflection-content" rows="8" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" placeholder="写下你的学习心得..."></textarea>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeReflectionModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
        <button onclick="saveReflection()" id="reflection-save-btn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg transition">保存心得</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let myClasses = [];
    let currentClassId = null;
    let currentTab = 'resources';
    let currentQuizId = null;
    let chaptersData = [];
    let resourcesByChapter = {};
    let quizzesByChapter = {};
    let allQuizzes = {};
    let submissionMap = {};
    let reflectionsByChapter = {};
    let currentReflectionChapterId = null;

    window.addEventListener('load', async () => {
      currentSession = await requireStudent();
      if (!currentSession) return;
      // 标记新手引导任务：已浏览学习资源
      localStorage.setItem('visited_resources', 'true');
      // 读取URL参数决定默认标签
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab') === 'quizzes') {
        currentTab = 'quizzes';
      }
      renderNavbar(currentSession, currentTab === 'quizzes' ? 'quizzes' : 'resources');
      await loadMyClasses();
    });

    async function loadMyClasses() {
      try {
        const { data: members, error } = await sb
          .from('class_members')
          .select('class_id, joined_at, classes(id, name, description, status)')
          .eq('user_id', currentSession.user.id)
          .order('joined_at', { ascending: true });
        if (error) throw error;

        myClasses = (members || []).map(m => m.classes).filter(c => c);
        const select = document.getElementById('class-select');

        if (myClasses.length === 0) {
          select.innerHTML = '<option value="">您还没有加入任何班级</option>';
          select.disabled = true;
          document.getElementById('resources-container').innerHTML = '<div class="text-center py-12 bg-white rounded-xl border border-gray-100"><p class="text-4xl mb-3">👋</p><p class="text-gray-500">您还没有加入任何班级</p><p class="text-gray-400 text-sm mt-1">请联系老师加入班级</p></div>';
          return;
        }

        select.innerHTML = myClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        // 优先读取上次选择的班级，没有则默认第一个
        const savedClassId = localStorage.getItem('selected_class_' + currentSession.user.id);
        currentClassId = (savedClassId && myClasses.some(c => c.id == savedClassId)) ? savedClassId : myClasses[0].id;
        select.value = currentClassId;
        await loadAllData();
        switchTab(currentTab);
        loadClassAnnouncements();
      } catch (e) {
        console.error('加载班级失败:', e);
        alert('加载班级失败：' + e.message);
      }
    }

    function onClassChange() {
      currentClassId = document.getElementById('class-select').value;
      if (currentClassId) {
        // 记住班级选择，下次进入默认选中
        localStorage.setItem('selected_class_' + currentSession.user.id, currentClassId);
        loadAllData().then(() => switchTab(currentTab));
        loadClassAnnouncements();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['resources', 'quizzes'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        const panel = document.getElementById('panel-' + t);
        if (t === tab) {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700';
          panel.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50';
          panel.classList.add('hidden');
        }
      });
      if (tab === 'resources') renderResources();
      if (tab === 'quizzes') renderQuizzes();
    }

    async function loadAllData() {
      if (!currentClassId) return;
      const cls = myClasses.find(c => c.id == currentClassId);
      if (cls) {
        document.getElementById('class-info').classList.remove('hidden');
        document.getElementById('class-name').textContent = cls.name;
        document.getElementById('class-description').textContent = cls.description || '';
      }

      // 显示加载状态
      const loadingHtml = '<div class="flex flex-col items-center justify-center py-16"><div class="w-10 h-10 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div><p class="text-sm text-gray-400 mt-3">加载中...</p></div>';
      document.getElementById('resources-container').innerHTML = loadingHtml;
      document.getElementById('quizzes-container').innerHTML = loadingHtml;
      document.getElementById('empty-resources').classList.add('hidden');
      document.getElementById('empty-quizzes').classList.add('hidden');

      try {
        // 加载章节
        const { data: chapters, error: ce } = await sb
          .from('chapters')
          .select('*')
          .eq('class_id', currentClassId)
          .order('sort_order', { ascending: true });
        if (ce) throw ce;
        chaptersData = chapters || [];

        // 加载资源
        const { data: chapterRes, error: re } = await sb
          .from('chapter_resources')
          .select('chapter_id, sort_order, resources(id, type, title, file_url, extraction_code, description)')
          .in('chapter_id', chaptersData.map(c => c.id))
          .order('sort_order', { ascending: true });
        if (re) throw re;

        resourcesByChapter = {};
        (chapterRes || []).forEach(cr => {
          if (!resourcesByChapter[cr.chapter_id]) resourcesByChapter[cr.chapter_id] = [];
          if (cr.resources) resourcesByChapter[cr.chapter_id].push(cr.resources);
        });

        // 加载测验（通过 chapter_quizzes 关联表）
        const { data: chapterQuizzes, error: cqe } = await sb
          .from('chapter_quizzes')
          .select('*, quizzes(*)')
          .in('chapter_id', chaptersData.map(c => c.id))
          .order('sort_order', { ascending: true });
        if (cqe) throw cqe;

        quizzesByChapter = {};
        allQuizzes = {};
        const quizIds = [];
        (chapterQuizzes || []).forEach(cq => {
          if (cq.quizzes) {
            if (!quizzesByChapter[cq.chapter_id]) quizzesByChapter[cq.chapter_id] = [];
            quizzesByChapter[cq.chapter_id].push(cq.quizzes);
            allQuizzes[cq.quizzes.id] = cq.quizzes;
            quizIds.push(cq.quizzes.id);
          }
        });

        // 加载我的答题记录（按班级过滤）
        const { data: submissions, error: se } = await sb
          .from('quiz_submissions')
          .select('*')
          .eq('user_id', currentSession.user.id)
          .eq('class_id', currentClassId)
          .in('quiz_id', quizIds);
        if (se) throw se;

        submissionMap = {};
        (submissions || []).forEach(s => { submissionMap[s.quiz_id] = s; });

        // 加载我的章节心得
        const { data: reflections, error: rfe } = await sb
          .from('chapter_reflections')
          .select('*')
          .eq('user_id', currentSession.user.id)
          .eq('class_id', currentClassId);
        if (rfe) throw rfe;
        reflectionsByChapter = {};
        (reflections || []).forEach(r => { reflectionsByChapter[r.chapter_id] = r; });

      } catch (e) {
        console.error('加载数据失败:', e);
        alert('加载数据失败：' + e.message);
      }
    }

    function renderResources() {
      const container = document.getElementById('resources-container');
      const empty = document.getElementById('empty-resources');
      const searchBox = document.getElementById('resource-search-box');
      const resultCount = document.getElementById('search-result-count');

      // 有班级选择时显示搜索框
      if (currentClassId) {
        searchBox.classList.remove('hidden');
      } else {
        searchBox.classList.add('hidden');
      }

      const keyword = (document.getElementById('resource-search-input')?.value || '').trim().toLowerCase();
      const hasSearch = keyword.length > 0;

      // 筛选章节和资源
      let filteredChapters = chaptersData.filter(ch => (resourcesByChapter[ch.id] || []).length > 0);
      let totalMatched = 0;

      if (hasSearch) {
        filteredChapters = filteredChapters.map(ch => {
          const matched = (resourcesByChapter[ch.id] || []).filter(r =>
            (r.title || '').toLowerCase().includes(keyword) ||
            (r.description || '').toLowerCase().includes(keyword)
          );
          totalMatched += matched.length;
          return { ...ch, _matchedResources: matched };
        }).filter(ch => ch._matchedResources.length > 0);

        // 显示搜索结果统计
        resultCount.textContent = `找到 ${totalMatched} 个匹配资源`;
        resultCount.classList.remove('hidden');
      } else {
        resultCount.classList.add('hidden');
      }

      if (filteredChapters.length === 0) {
        container.innerHTML = hasSearch
          ? `<div class="text-center py-12 bg-white rounded-xl border border-gray-100"><p class="text-4xl mb-3">🔍</p><p class="text-gray-500">未找到包含「${escapeHtml(keyword)}」的资源</p></div>`
          : '';
        empty.classList.toggle('hidden', hasSearch);
        if (hasSearch) empty.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');

      container.innerHTML = filteredChapters.map((ch, idx) => {
        const resources = hasSearch ? ch._matchedResources : (resourcesByChapter[ch.id] || []);
        const reflection = reflectionsByChapter[ch.id];
        const hasReflection = reflection && reflection.content && reflection.content.trim();
        return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 bg-gray-50 border-b">
            <div class="flex items-center">
              <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-medium mr-3">${idx + 1}</span>
              <h2 class="text-lg font-semibold text-gray-800">${escapeHtml(ch.title)}</h2>
              <span class="ml-3 text-xs text-gray-400">${resources.length} 个资源</span>
            </div>
          </div>
          <div class="p-4 space-y-3">
            ${resources.map(r => renderResourceCard(r)).join('')}
          </div>
          <div class="px-4 pb-4">
            <div class="border-t border-gray-100 pt-3">
              ${hasReflection ? `
                <div class="bg-amber-50 border border-amber-100 rounded-lg p-3">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-amber-800">📝 我的学习心得</span>
                    <button onclick="openReflectionModal(${ch.id})" class="text-xs text-amber-600 hover:text-amber-700">编辑</button>
                  </div>
                  <p class="text-sm text-gray-700 whitespace-pre-wrap">${escapeHtml(reflection.content)}</p>
                  <p class="text-xs text-gray-400 mt-2">最后更新：${formatDate(reflection.updated_at)}</p>
                </div>
              ` : `
                <button onclick="openReflectionModal(${ch.id})" class="w-full py-2 border border-dashed border-gray-300 rounded-lg text-sm text-gray-500 hover:border-amber-400 hover:text-amber-600 hover:bg-amber-50 transition">
                  ✍️ 写下本章学习心得
                </button>
              `}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function onResourceSearch() {
      renderResources();
    }

    function renderQuizzes() {
      const container = document.getElementById('quizzes-container');
      const empty = document.getElementById('empty-quizzes');

      const chaptersWithQuizzes = chaptersData.filter(ch => (quizzesByChapter[ch.id] || []).length > 0);

      if (chaptersWithQuizzes.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      container.innerHTML = chaptersWithQuizzes.map((ch, idx) => {
        const quizzes = quizzesByChapter[ch.id] || [];
        const answeredCount = quizzes.filter(q => submissionMap[q.id]).length;
        return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 bg-gray-50 border-b">
            <div class="flex items-center">
              <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-medium mr-3">${idx + 1}</span>
              <h2 class="text-lg font-semibold text-gray-800">${escapeHtml(ch.title)}</h2>
              <span class="ml-3 text-xs text-gray-400">${answeredCount}/${quizzes.length} 已答</span>
            </div>
          </div>
          <div class="p-4 space-y-3">
            ${quizzes.map(q => renderQuizCard(q, submissionMap[q.id])).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function renderResourceCard(r) {
      const isPdf = r.type === 'pdf';
      const read = isResourceRead(r.id);
      return `
        <div data-resource-id="${r.id}" class="flex items-center justify-between p-4 border border-gray-100 rounded-lg hover:bg-gray-50 transition ${read ? 'opacity-70' : ''}">
          <div class="flex items-center flex-1 min-w-0">
            <span class="text-2xl mr-4 flex-shrink-0">${isPdf ? '📄' : '🎬'}</span>
            <div class="min-w-0">
              <div class="flex items-center">
                <p class="font-medium resource-title ${read ? 'text-gray-400' : 'text-gray-800'} truncate">${escapeHtml(r.title)}</p>
                ${read ? '<span class="read-tag ml-2 text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full flex-shrink-0">✓ 已读</span>' : ''}
              </div>
              ${r.description ? `<p class="text-xs text-gray-400 truncate mt-1">${escapeHtml(r.description)}</p>` : `<p class="text-xs text-gray-400 mt-1">${isPdf ? 'PDF 文档' : '视频课程 · 百度网盘'}</p>`}
            </div>
          </div>
          <div class="flex-shrink-0 ml-4">
            ${isPdf && r.file_url ? `<a href="${r.file_url}" target="_blank" onclick="markResourceRead(${r.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition inline-flex items-center"><span class="mr-1">👁️</span> 查看</a>` : ''}
            ${!isPdf && r.file_url ? `<button onclick="markResourceRead(${r.id}); copyVideoLink('${r.file_url}', '${r.extraction_code || ''}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition inline-flex items-center"><span class="mr-1">📋</span> 复制链接</button>` : ''}
          </div>
        </div>`;
    }

    // 资源已读标记（localStorage）
    function getReadKey() {
      return 'read_resources_' + (currentSession ? currentSession.user.id : 'unknown');
    }
    function isResourceRead(resourceId) {
      try {
        const read = JSON.parse(localStorage.getItem(getReadKey()) || '[]');
        return read.includes(resourceId);
      } catch (e) { return false; }
    }
    function markResourceRead(resourceId) {
      try {
        const read = JSON.parse(localStorage.getItem(getReadKey()) || '[]');
        if (!read.includes(resourceId)) {
          read.push(resourceId);
          localStorage.setItem(getReadKey(), JSON.stringify(read));
        }
      } catch (e) {}
      // 立即更新当前卡片样式
      const card = document.querySelector(`[data-resource-id="${resourceId}"]`);
      if (card) {
        card.classList.add('opacity-70');
        const title = card.querySelector('.resource-title');
        if (title) { title.classList.remove('text-gray-800'); title.classList.add('text-gray-400'); }
        const titleWrap = card.querySelector('.resource-title').parentElement;
        if (titleWrap && !titleWrap.querySelector('.read-tag')) {
          const tag = document.createElement('span');
          tag.className = 'read-tag ml-2 text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full flex-shrink-0';
          tag.textContent = '✓ 已读';
          titleWrap.appendChild(tag);
        }
      }
    }

    function renderQuizCard(q, submission) {
      const answered = !!submission;
      const graded = submission && submission.score !== null;
      return `
        <div class="p-4 border border-gray-100 rounded-lg hover:bg-gray-50 transition cursor-pointer" onclick="openQuizModal(${q.id})">
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-800">${escapeHtml(q.question_text)}</p>
              ${answered ? `<p class="text-xs text-gray-400 mt-2">已提交 · ${formatDate(submission.submitted_at)}</p>` : '<p class="text-xs text-gray-400 mt-2">点击答题</p>'}
            </div>
            <div class="flex-shrink-0 ml-3">
              ${graded ? `<span class="text-xs px-2 py-1 ${submission.score === 1 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} rounded">${submission.score === 1 ? '合格' : '不合格'}</span>` :
                answered ? `<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">待评分</span>` :
                `<span class="text-xs px-2 py-1 bg-blue-100 text-blue-600 rounded">未答题</span>`}
            </div>
          </div>
          ${graded && submission.teacher_comment ? `<div class="mt-3 text-sm text-blue-700 bg-blue-50 rounded-lg p-3"><span class="font-medium">老师评语：</span>${escapeHtml(submission.teacher_comment)}</div>` : ''}
        </div>`;
    }

    function openQuizModal(quizId) {
      const quiz = allQuizzes[quizId];
      if (!quiz) { alert('题目不存在'); return; }
      currentQuizId = quizId;
      document.getElementById('quiz-question-text').textContent = quiz.question_text;
      document.getElementById('quiz-answer-input').value = '';
      document.getElementById('quiz-result-area').classList.add('hidden');
      document.getElementById('quiz-answer-area').classList.remove('hidden');
      document.getElementById('quiz-submit-btn').classList.remove('hidden');
      document.getElementById('quiz-submit-btn').textContent = '提交答案';
      document.getElementById('quiz-submit-btn').disabled = false;

      const sub = submissionMap[quizId];
      if (sub) {
        document.getElementById('quiz-answer-input').value = sub.answer || '';
        if (sub.score !== null) {
          document.getElementById('quiz-answer-area').classList.add('hidden');
          document.getElementById('quiz-submit-btn').classList.add('hidden');
          document.getElementById('quiz-result-area').classList.remove('hidden');
          document.getElementById('quiz-result-area').innerHTML = `
            <div class="bg-gray-50 rounded-lg p-4 mb-3">
              <p class="text-xs font-medium text-gray-500 mb-2">你的答案</p>
              <p class="text-sm text-gray-700 whitespace-pre-wrap">${escapeHtml(sub.answer || '（无内容）')}</p>
            </div>
            <div class="bg-green-50 rounded-lg p-4">
              <p class="text-sm font-medium ${sub.score === 1 ? 'text-green-700' : 'text-red-700'}">评分结果：${sub.score === 1 ? '✅ 合格' : '❌ 不合格'}</p>
              ${sub.teacher_comment ? `<p class="text-sm text-green-600 mt-2"><span class="font-medium">老师评语：</span>${escapeHtml(sub.teacher_comment)}</p>` : ''}
            </div>`;
        } else {
          document.getElementById('quiz-submit-btn').textContent = '更新答案';
        }
      }
      document.getElementById('quiz-modal').classList.remove('hidden');
    }

    function closeQuizModal() {
      document.getElementById('quiz-modal').classList.add('hidden');
      currentQuizId = null;
    }

    function submitQuizAnswer() {
      const answer = document.getElementById('quiz-answer-input').value.trim();
      if (!answer) { alert('请输入答案'); return; }
      // 显示确认弹窗
      const existing = submissionMap[currentQuizId];
      const warning = document.getElementById('submit-confirm-warning');
      if (existing) { warning.classList.remove('hidden'); } else { warning.classList.add('hidden'); }
      document.getElementById('submit-confirm-modal').classList.remove('hidden');
    }

    function closeSubmitConfirm() {
      document.getElementById('submit-confirm-modal').classList.add('hidden');
    }

    async function confirmSubmitQuiz() {
      closeSubmitConfirm();
      const answer = document.getElementById('quiz-answer-input').value.trim();
      const btn = document.getElementById('quiz-submit-btn');
      btn.disabled = true; btn.textContent = '提交中...';
      try {
        const existing = submissionMap[currentQuizId];
        if (existing) {
          const { error } = await sb.from('quiz_submissions').update({ answer, submitted_at: new Date().toISOString() }).eq('id', existing.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('quiz_submissions').insert({ quiz_id: currentQuizId, user_id: currentSession.user.id, class_id: currentClassId, answer });
          if (error) throw error;
        }
        alert('答案提交成功！');
        closeQuizModal();
        await loadAllData();
        renderQuizzes();
      } catch (e) { alert('提交失败：' + e.message); }
      finally { btn.disabled = false; btn.textContent = '提交答案'; }
    }

    function copyVideoLink(url, code) {
      const copyUrl = code ? `${url}?pwd=${code}` : url;
      navigator.clipboard.writeText(copyUrl).then(() => {
        alert('链接已复制到剪贴板\n\n' + copyUrl + (code ? '\n\n提取码：' + code + '（已自动带入网址）' : ''));
      }).catch(() => {
        alert('复制失败，请手动复制：\n' + copyUrl);
      });
    }

    // 心得相关函数
    function insertReflectionPrompt(text) {
      const ta = document.getElementById('reflection-content');
      const current = ta.value.trim();
      ta.value = current ? current + '\n\n' + text : text;
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    function openReflectionModal(chapterId) {
      currentReflectionChapterId = chapterId;
      const ch = chaptersData.find(c => c.id === chapterId);
      document.getElementById('reflection-modal-title').textContent = ch ? `学习心得 - ${ch.title}` : '学习心得';
      const existing = reflectionsByChapter[chapterId];
      document.getElementById('reflection-content').value = existing ? existing.content : '';
      document.getElementById('reflection-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('reflection-content').focus(), 100);
    }

    function closeReflectionModal() {
      document.getElementById('reflection-modal').classList.add('hidden');
      currentReflectionChapterId = null;
    }

    async function saveReflection() {
      const content = document.getElementById('reflection-content').value.trim();
      if (!content) { alert('请输入心得内容'); return; }
      const btn = document.getElementById('reflection-save-btn');
      btn.disabled = true; btn.textContent = '保存中...';
      try {
        const existing = reflectionsByChapter[currentReflectionChapterId];
        if (existing) {
          const { error } = await sb.from('chapter_reflections')
            .update({ content })
            .eq('id', existing.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('chapter_reflections').insert({
            user_id: currentSession.user.id,
            class_id: currentClassId,
            chapter_id: currentReflectionChapterId,
            content
          });
          if (error) throw error;
        }
        closeReflectionModal();
        await loadAllData();
        renderResources();
      } catch (e) {
        alert('保存失败：' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '保存心得';
      }
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // 加载班级公告
    async function loadClassAnnouncements() {
      if (!currentClassId) return;
      try {
        const now = new Date().toISOString();
        const { data, error } = await sb
          .from('announcements')
          .select('*')
          .eq('class_id', currentClassId)
          .or(`expires_at.is.null,expires_at.gte.${now}`)
          .order('is_pinned', { ascending: false })
          .order('created_at', { ascending: false });
        if (error) throw error;

        const section = document.getElementById('announcement-section');
        const list = document.getElementById('announcement-list');
        const empty = document.getElementById('announcement-empty');

        if (!data || data.length === 0) {
          section.classList.remove('hidden');
          list.innerHTML = '';
          empty.classList.remove('hidden');
          return;
        }

        empty.classList.add('hidden');
        section.classList.remove('hidden');

        // 查询当前用户已读记录
        const announcementIds = data.map(a => a.id);
        const { data: readRecords } = await sb
          .from('announcement_reads')
          .select('announcement_id')
          .eq('user_id', currentSession.user.id)
          .in('announcement_id', announcementIds);
        const readIds = new Set((readRecords || []).map(r => r.announcement_id));

        list.innerHTML = data.map(a => {
          const isUnread = !readIds.has(a.id);
          return `<div class="border-l-4 ${isUnread ? 'border-blue-400' : 'border-gray-200'} pl-3 py-2 cursor-pointer hover:bg-gray-50 rounded-r transition" onclick="markClassAnnouncementRead('${a.id}', this)">
            <div class="flex items-center gap-2 flex-wrap">
              ${a.is_pinned ? '<span class="text-xs px-1.5 py-0.5 bg-red-100 text-red-600 rounded font-medium">📌 置顶</span>' : ''}
              ${isUnread ? '<span class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded font-bold">未读</span>' : ''}
              <span class="font-medium ${isUnread ? 'text-gray-800' : 'text-gray-500'}">${escapeHtml(a.title)}</span>
              <span class="text-xs text-gray-400 ml-auto">${formatDate(a.created_at)}</span>
            </div>
            <p class="text-sm ${isUnread ? 'text-gray-600' : 'text-gray-400'} mt-1 whitespace-pre-wrap">${escapeHtml(a.content)}</p>
          </div>`;
        }).join('');
      } catch (e) { console.error('加载公告失败:', e); }
    }

    // 标记学习资源页公告为已读
    async function markClassAnnouncementRead(announcementId, element) {
      try {
        await sb.from('announcement_reads').upsert({
          user_id: currentSession.user.id,
          announcement_id: announcementId,
          read_at: new Date().toISOString()
        }, { onConflict: 'user_id,announcement_id' });
        // 更新UI
        if (element) {
          element.classList.remove('border-blue-400');
          element.classList.add('border-gray-200');
          const tag = element.querySelector('.bg-blue-100');
          if (tag) tag.remove();
          const title = element.querySelector('.font-medium');
          if (title) { title.classList.remove('text-gray-800'); title.classList.add('text-gray-500'); }
          const content = element.querySelector('p');
          if (content) { content.classList.remove('text-gray-600'); content.classList.add('text-gray-400'); }
        }
      } catch (e) { console.error('标记已读失败:', e); }
    }

    function formatDate(s) {
      if (!s) return '-';
      return new Date(s).toLocaleDateString('zh-CN');
    }
  </script>
</body>
</html>
