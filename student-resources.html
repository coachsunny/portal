<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习资源 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 班级选择器 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">选择班级</label>
      <select id="class-select" onchange="onClassChange()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
        <option value="">加载中...</option>
      </select>
    </div>

    <!-- 标签切换 -->
    <div class="flex space-x-1 mb-6 bg-white rounded-xl p-1 border border-gray-100 w-fit">
      <button onclick="switchTab('resources')" id="tab-resources" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700">📚 学习资源</button>
      <button onclick="switchTab('quizzes')" id="tab-quizzes" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">📝 我的测验</button>
    </div>

    <!-- 班级信息 -->
    <div id="class-info" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h1 class="text-xl font-bold text-gray-800" id="class-name"></h1>
      <p class="text-gray-500 mt-1" id="class-description"></p>
    </div>

    <!-- 学习资源面板 -->
    <div id="panel-resources">
      <div id="resources-container">
        <div class="text-center py-12 text-gray-400">
          <p class="text-4xl mb-3">📚</p>
          <p>请选择班级查看学习资源</p>
        </div>
      </div>
      <div id="empty-resources" class="hidden text-center py-12 bg-white rounded-xl border border-gray-100">
        <p class="text-4xl mb-3">📖</p>
        <p class="text-gray-500">这个班级还没有学习资源</p>
      </div>
    </div>

    <!-- 测验面板 -->
    <div id="panel-quizzes" class="hidden">
      <div id="quizzes-container"></div>
      <div id="empty-quizzes" class="hidden text-center py-12 bg-white rounded-xl border border-gray-100">
        <p class="text-4xl mb-3">📝</p>
        <p class="text-gray-500">这个班级还没有测验题目</p>
      </div>
    </div>
  </main>

  <!-- 答题弹窗 -->
  <div id="quiz-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800">测验答题</h3>
        <p class="text-sm text-gray-500 mt-2" id="quiz-question-text"></p>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <div id="quiz-result-area" class="hidden mb-4"></div>
        <div id="quiz-answer-area">
          <label class="block text-sm font-medium text-gray-700 mb-2">你的答案</label>
          <textarea id="quiz-answer-input" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入你的答案..."></textarea>
        </div>
      </div>
      <div class="p-6 border-t flex justify-end space-x-3">
        <button onclick="closeQuizModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
        <button onclick="submitQuizAnswer()" id="quiz-submit-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">提交答案</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let myClasses = [];
    let currentClassId = null;
    let currentTab = 'resources';
    let currentQuizId = null;
    let chaptersData = [];
    let resourcesByChapter = {};
    let quizzesByChapter = {};
    let allQuizzes = {};
    let submissionMap = {};

    window.addEventListener('load', async () => {
      currentSession = await requireStudent();
      if (!currentSession) return;
      // 读取URL参数决定默认标签
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab') === 'quizzes') {
        currentTab = 'quizzes';
      }
      renderNavbar(currentSession, currentTab === 'quizzes' ? 'quizzes' : 'resources');
      await loadMyClasses();
    });

    async function loadMyClasses() {
      try {
        const { data: members, error } = await sb
          .from('class_members')
          .select('class_id, joined_at, classes(id, name, description, status)')
          .eq('user_id', currentSession.user.id)
          .order('joined_at', { ascending: true });
        if (error) throw error;

        myClasses = (members || []).map(m => m.classes).filter(c => c);
        const select = document.getElementById('class-select');

        if (myClasses.length === 0) {
          select.innerHTML = '<option value="">您还没有加入任何班级</option>';
          select.disabled = true;
          document.getElementById('resources-container').innerHTML = '<div class="text-center py-12 bg-white rounded-xl border border-gray-100"><p class="text-4xl mb-3">👋</p><p class="text-gray-500">您还没有加入任何班级</p><p class="text-gray-400 text-sm mt-1">请联系老师加入班级</p></div>';
          return;
        }

        select.innerHTML = myClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        currentClassId = myClasses[0].id;
        select.value = currentClassId;
        await loadAllData();
        switchTab(currentTab);
      } catch (e) {
        console.error('加载班级失败:', e);
        alert('加载班级失败：' + e.message);
      }
    }

    function onClassChange() {
      currentClassId = document.getElementById('class-select').value;
      if (currentClassId) {
        loadAllData().then(() => switchTab(currentTab));
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['resources', 'quizzes'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        const panel = document.getElementById('panel-' + t);
        if (t === tab) {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700';
          panel.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50';
          panel.classList.add('hidden');
        }
      });
      if (tab === 'resources') renderResources();
      if (tab === 'quizzes') renderQuizzes();
    }

    async function loadAllData() {
      if (!currentClassId) return;
      const cls = myClasses.find(c => c.id == currentClassId);
      if (cls) {
        document.getElementById('class-info').classList.remove('hidden');
        document.getElementById('class-name').textContent = cls.name;
        document.getElementById('class-description').textContent = cls.description || '';
      }

      try {
        // 加载章节
        const { data: chapters, error: ce } = await sb
          .from('chapters')
          .select('*')
          .eq('class_id', currentClassId)
          .order('sort_order', { ascending: true });
        if (ce) throw ce;
        chaptersData = chapters || [];

        // 加载资源
        const { data: chapterRes, error: re } = await sb
          .from('chapter_resources')
          .select('chapter_id, sort_order, resources(id, type, title, file_url, extraction_code, description)')
          .in('chapter_id', chaptersData.map(c => c.id))
          .order('sort_order', { ascending: true });
        if (re) throw re;

        resourcesByChapter = {};
        (chapterRes || []).forEach(cr => {
          if (!resourcesByChapter[cr.chapter_id]) resourcesByChapter[cr.chapter_id] = [];
          if (cr.resources) resourcesByChapter[cr.chapter_id].push(cr.resources);
        });

        // 加载测验
        const { data: quizzes, error: qe } = await sb
          .from('quizzes')
          .select('*')
          .in('chapter_id', chaptersData.map(c => c.id))
          .order('sort_order', { ascending: true });
        if (qe) throw qe;

        quizzesByChapter = {};
        allQuizzes = {};
        (quizzes || []).forEach(q => {
          if (!quizzesByChapter[q.chapter_id]) quizzesByChapter[q.chapter_id] = [];
          quizzesByChapter[q.chapter_id].push(q);
          allQuizzes[q.id] = q;
        });

        // 加载我的答题记录
        const { data: submissions, error: se } = await sb
          .from('quiz_submissions')
          .select('*')
          .eq('user_id', currentSession.user.id)
          .in('quiz_id', (quizzes || []).map(q => q.id));
        if (se) throw se;

        submissionMap = {};
        (submissions || []).forEach(s => { submissionMap[s.quiz_id] = s; });

      } catch (e) {
        console.error('加载数据失败:', e);
        alert('加载数据失败：' + e.message);
      }
    }

    function renderResources() {
      const container = document.getElementById('resources-container');
      const empty = document.getElementById('empty-resources');

      const chaptersWithResources = chaptersData.filter(ch => (resourcesByChapter[ch.id] || []).length > 0);

      if (chaptersWithResources.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      container.innerHTML = chaptersWithResources.map((ch, idx) => {
        const resources = resourcesByChapter[ch.id] || [];
        return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 bg-gray-50 border-b">
            <div class="flex items-center">
              <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-medium mr-3">${idx + 1}</span>
              <h2 class="text-lg font-semibold text-gray-800">${escapeHtml(ch.title)}</h2>
              <span class="ml-3 text-xs text-gray-400">${resources.length} 个资源</span>
            </div>
          </div>
          <div class="p-4 space-y-3">
            ${resources.map(r => renderResourceCard(r)).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function renderQuizzes() {
      const container = document.getElementById('quizzes-container');
      const empty = document.getElementById('empty-quizzes');

      const chaptersWithQuizzes = chaptersData.filter(ch => (quizzesByChapter[ch.id] || []).length > 0);

      if (chaptersWithQuizzes.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      container.innerHTML = chaptersWithQuizzes.map((ch, idx) => {
        const quizzes = quizzesByChapter[ch.id] || [];
        const answeredCount = quizzes.filter(q => submissionMap[q.id]).length;
        return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 bg-gray-50 border-b">
            <div class="flex items-center">
              <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm font-medium mr-3">${idx + 1}</span>
              <h2 class="text-lg font-semibold text-gray-800">${escapeHtml(ch.title)}</h2>
              <span class="ml-3 text-xs text-gray-400">${answeredCount}/${quizzes.length} 已答</span>
            </div>
          </div>
          <div class="p-4 space-y-3">
            ${quizzes.map(q => renderQuizCard(q, submissionMap[q.id])).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function renderResourceCard(r) {
      const isPdf = r.type === 'pdf';
      return `
        <div class="flex items-center justify-between p-4 border border-gray-100 rounded-lg hover:bg-gray-50 transition">
          <div class="flex items-center flex-1 min-w-0">
            <span class="text-2xl mr-4 flex-shrink-0">${isPdf ? '📄' : '🎬'}</span>
            <div class="min-w-0">
              <p class="font-medium text-gray-800 truncate">${escapeHtml(r.title)}</p>
              ${r.description ? `<p class="text-xs text-gray-400 truncate mt-1">${escapeHtml(r.description)}</p>` : `<p class="text-xs text-gray-400 mt-1">${isPdf ? 'PDF 文档' : '视频课程 · 百度网盘'}</p>`}
            </div>
          </div>
          <div class="flex-shrink-0 ml-4">
            ${isPdf && r.file_url ? `<a href="${r.file_url}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition inline-flex items-center"><span class="mr-1">👁️</span> 查看</a>` : ''}
            ${!isPdf && r.file_url ? `<button onclick="copyVideoLink('${r.file_url}', '${r.extraction_code || ''}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg transition inline-flex items-center"><span class="mr-1">📋</span> 复制链接</button>` : ''}
          </div>
        </div>`;
    }

    function renderQuizCard(q, submission) {
      const answered = !!submission;
      const graded = submission && submission.score !== null;
      return `
        <div class="p-4 border border-gray-100 rounded-lg hover:bg-gray-50 transition cursor-pointer" onclick="openQuizModal(${q.id})">
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-800">${escapeHtml(q.question_text)}</p>
              ${answered ? `<p class="text-xs text-gray-400 mt-2">已提交 · ${formatDate(submission.submitted_at)}</p>` : '<p class="text-xs text-gray-400 mt-2">点击答题</p>'}
            </div>
            <div class="flex-shrink-0 ml-3">
              ${graded ? `<span class="text-xs px-2 py-1 bg-green-100 text-green-700 rounded">${submission.score} 分</span>` :
                answered ? `<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">待评分</span>` :
                `<span class="text-xs px-2 py-1 bg-blue-100 text-blue-600 rounded">未答题</span>`}
            </div>
          </div>
          ${graded && submission.teacher_comment ? `<div class="mt-3 text-sm text-blue-700 bg-blue-50 rounded-lg p-3"><span class="font-medium">老师评语：</span>${escapeHtml(submission.teacher_comment)}</div>` : ''}
        </div>`;
    }

    function openQuizModal(quizId) {
      const quiz = allQuizzes[quizId];
      if (!quiz) { alert('题目不存在'); return; }
      currentQuizId = quizId;
      document.getElementById('quiz-question-text').textContent = quiz.question_text;
      document.getElementById('quiz-answer-input').value = '';
      document.getElementById('quiz-result-area').classList.add('hidden');
      document.getElementById('quiz-answer-area').classList.remove('hidden');
      document.getElementById('quiz-submit-btn').classList.remove('hidden');
      document.getElementById('quiz-submit-btn').textContent = '提交答案';
      document.getElementById('quiz-submit-btn').disabled = false;

      const sub = submissionMap[quizId];
      if (sub) {
        document.getElementById('quiz-answer-input').value = sub.answer || '';
        if (sub.score !== null) {
          document.getElementById('quiz-answer-area').classList.add('hidden');
          document.getElementById('quiz-submit-btn').classList.add('hidden');
          document.getElementById('quiz-result-area').classList.remove('hidden');
          document.getElementById('quiz-result-area').innerHTML = `
            <div class="bg-gray-50 rounded-lg p-4 mb-3">
              <p class="text-xs font-medium text-gray-500 mb-2">你的答案</p>
              <p class="text-sm text-gray-700 whitespace-pre-wrap">${escapeHtml(sub.answer || '（无内容）')}</p>
            </div>
            <div class="bg-green-50 rounded-lg p-4">
              <p class="text-sm font-medium text-green-700">得分：${sub.score} 分</p>
              ${sub.teacher_comment ? `<p class="text-sm text-green-600 mt-2"><span class="font-medium">老师评语：</span>${escapeHtml(sub.teacher_comment)}</p>` : ''}
            </div>`;
        } else {
          document.getElementById('quiz-submit-btn').textContent = '更新答案';
        }
      }
      document.getElementById('quiz-modal').classList.remove('hidden');
    }

    function closeQuizModal() {
      document.getElementById('quiz-modal').classList.add('hidden');
      currentQuizId = null;
    }

    async function submitQuizAnswer() {
      const answer = document.getElementById('quiz-answer-input').value.trim();
      if (!answer) { alert('请输入答案'); return; }
      const btn = document.getElementById('quiz-submit-btn');
      btn.disabled = true; btn.textContent = '提交中...';
      try {
        const existing = submissionMap[currentQuizId];
        if (existing) {
          const { error } = await sb.from('quiz_submissions').update({ answer, submitted_at: new Date().toISOString() }).eq('id', existing.id);
          if (error) throw error;
        } else {
          const { error } = await sb.from('quiz_submissions').insert({ quiz_id: currentQuizId, user_id: currentSession.user.id, answer });
          if (error) throw error;
        }
        alert('答案提交成功！');
        closeQuizModal();
        await loadAllData();
        renderQuizzes();
      } catch (e) { alert('提交失败：' + e.message); }
      finally { btn.disabled = false; btn.textContent = '提交答案'; }
    }

    function copyVideoLink(url, code) {
      const copyUrl = code ? `${url}?pwd=${code}` : url;
      navigator.clipboard.writeText(copyUrl).then(() => {
        alert('链接已复制到剪贴板\n\n' + copyUrl + (code ? '\n\n提取码：' + code + '（已自动带入网址）' : ''));
      }).catch(() => {
        alert('复制失败，请手动复制：\n' + copyUrl);
      });
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function formatDate(s) {
      if (!s) return '-';
      return new Date(s).toLocaleDateString('zh-CN');
    }
  </script>
</body>
</html>
