<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>个人中心 - 自牧平施教练班</title>  <script src="https://cdn.tailwindcss.com"></script>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-gray-50 min-h-screen">  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">    <!-- 页面标题 -->    <div class="mb-6">      <h1 class="text-2xl font-bold text-gray-800">👤 个人中心</h1>      <p class="text-gray-500 mt-1">管理你的账号信息和密码</p>    </div>    <!-- 基本信息 -->    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">      <h2 class="text-lg font-semibold text-gray-800 mb-4">基本信息</h2>      <div class="flex items-center mb-6">        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-2xl font-bold text-blue-600" id="avatar-letter">?</div>        <div class="ml-4">          <p class="text-lg font-semibold text-gray-800" id="display-name">-</p>          <p class="text-sm text-gray-500" id="display-email">-</p>          <p class="text-sm text-gray-500 mt-1" id="display-expiry">-</p>          <span class="inline-block mt-1 px-2 py-0.5 text-xs bg-green-100 text-green-700 rounded-full">学员</span>        </div>      </div>      <!-- 修改姓名 -->      <div class="border-t pt-4">        <label class="block text-sm font-medium text-gray-700 mb-2">修改姓名</label>        <div class="flex gap-2">          <input type="text" id="name-input" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入新姓名">          <button onclick="updateName()" id="name-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition disabled:opacity-50">保存</button>        </div>        <p id="name-msg" class="text-sm mt-2 hidden"></p>      </div>    </div>    <!-- 修改密码 -->    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">      <h2 class="text-lg font-semibold text-gray-800 mb-4">🔒 修改密码</h2>      <div class="space-y-4">        <div>          <label class="block text-sm font-medium text-gray-700 mb-2">当前密码 <span class="text-red-500">*</span></label>          <input type="password" id="old-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入当前密码">        </div>        <div>          <label class="block text-sm font-medium text-gray-700 mb-2">新密码 <span class="text-red-500">*</span></label>          <input type="password" id="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="至少6位字符">        </div>        <div>          <label class="block text-sm font-medium text-gray-700 mb-2">确认新密码 <span class="text-red-500">*</span></label>          <input type="password" id="confirm-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="再次输入新密码">        </div>        <div class="flex justify-end">          <button onclick="updatePassword()" id="password-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition disabled:opacity-50">修改密码</button>        </div>        <p id="password-msg" class="text-sm hidden"></p>      </div>    </div>  </main>  <script src="js/supabase-client.js"></script>  <script src="js/auth.js"></script>  <script>    let currentSession = null;    window.addEventListener('load', async () => {      currentSession = await requireStudent();      if (!currentSession) return;      renderNavbar(currentSession, 'profile');      /* 显示基本信息      document.getElementById('display-name').textContent = currentSession.name*/;      document.getElementById('display-email').textContent = currentSession.user.email;      document.getElementById('avatar-letter').textContent = currentSession.name.charAt(0);      document.getElementById('name-input').value = currentSession.name;      /* 显示有效期      if (currentSession.membershipExpiresAt) {        const expiryDate = new Date(currentSession.membershipExpiresAt)*/;        const daysToExpiry = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));        let colorClass = 'text-green-600';        let statusText = '有效';        if (daysToExpiry < 0) {          colorClass = 'text-red-600';          statusText = '已过期';        } else if (daysToExpiry <= 60) {          colorClass = 'text-yellow-600';          statusText = `${daysToExpiry}天后到期`;        }        document.getElementById('display-expiry').innerHTML = `📅 学习资格：<span class="${colorClass} font-medium">${expiryDate.toLocaleDateString('zh-CN')}（${statusText}）</span>`;      } else {        document.getElementById('display-expiry').innerHTML = `📅 学习资格：<span class="text-green-600 font-medium">永久</span>`;      }    });    /* 修改姓名    async function updateName() {      const newName = document.getElementById('name-input').value.trim()*/;      const msgEl = document.getElementById('name-msg');      const btn = document.getElementById('name-btn');      if (!newName) {        showMsg(msgEl, '姓名不能为空', 'error');        return;      }      if (newName === currentSession.name) {        showMsg(msgEl, '姓名没有变化', 'info');        return;      }      btn.disabled = true;      btn.textContent = '保存中...';      try {        const { error } = await sb          .from('profiles')          .update({ name: newName })          .eq('id', currentSession.user.id);        if (error) throw error;        currentSession.name = newName;        document.getElementById('display-name').textContent = newName;        document.getElementById('avatar-letter').textContent = newName.charAt(0);        /* 更新导航栏显示的名字        const navNameEl = document.querySelector('nav span.text-sm.text-gray-600')*/;        if (navNameEl) navNameEl.textContent = newName;        showMsg(msgEl, '✅ 姓名修改成功', 'success');      } catch (e) {        showMsg(msgEl, '修改失败：' + e.message, 'error');      } finally {        btn.disabled = false;        btn.textContent = '保存';      }    }    /* 修改密码    async function updatePassword() {      const oldPwd = document.getElementById('old-password').value*/;      const newPwd = document.getElementById('new-password').value;      const confirmPwd = document.getElementById('confirm-password').value;      const msgEl = document.getElementById('password-msg');      const btn = document.getElementById('password-btn');      /* 校验      if (!oldPwd || !newPwd || !confirmPwd) {        showMsg(msgEl, '请填写所有密码字段', 'error')*/;        return;      }      if (newPwd.length < 6) {        showMsg(msgEl, '新密码至少需要6位字符', 'error');        return;      }      if (newPwd !== confirmPwd) {        showMsg(msgEl, '两次输入的新密码不一致', 'error');        return;      }      if (newPwd === oldPwd) {        showMsg(msgEl, '新密码不能与当前密码相同', 'error');        return;      }      btn.disabled = true;      btn.textContent = '修改中...';      try {        /* 先验证旧密码是否正确        const { error: signInError */} = await sb.auth.signInWithPassword({          email: currentSession.user.email,          password: oldPwd        });        if (signInError) {          showMsg(msgEl, '当前密码不正确', 'error');          return;        }        /* 旧密码正确，更新密码        const { error: updateError */} = await sb.auth.updateUser({          password: newPwd        });        if (updateError) throw updateError;        showMsg(msgEl, '✅ 密码修改成功，请使用新密码登录', 'success');        /* 清空表单        document.getElementById('old-password').value = ''*/;        document.getElementById('new-password').value = '';        document.getElementById('confirm-password').value = '';      } catch (e) {        showMsg(msgEl, '修改失败：' + e.message, 'error');      } finally {        btn.disabled = false;        btn.textContent = '修改密码';      }    }    function showMsg(el, text, type) {      el.textContent = text;      el.classList.remove('hidden', 'text-red-500', 'text-green-600', 'text-gray-500');      if (type === 'error') el.classList.add('text-red-500');      else if (type === 'success') el.classList.add('text-green-600');      else el.classList.add('text-gray-500');      el.classList.remove('hidden');    }  </script></body></html>
