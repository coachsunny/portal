<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <!-- Logo / 标题 -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="text-white text-2xl font-bold">自</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">自牧平施教练班</h1>
      <p class="text-gray-500 text-sm mt-1">教学支持系统</p>
    </div>

    <!-- 登录表单 -->
    <div id="login-form">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-medium mb-2">邮箱</label>
        <input type="email" id="email" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="请输入邮箱">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-medium mb-2">密码</label>
        <input type="password" id="password" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="请输入密码">
      </div>
      <button onclick="handleLogin()" id="login-btn" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-2.5 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 transition">登录</button>
      <p id="login-message" class="mt-4 text-sm text-center"></p>
    </div>

    <!-- 底部提示 -->
    <div class="mt-6 text-center text-xs text-gray-400">
      <p>账号由老师统一创建，如有问题请联系管理员</p>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 页面加载时检查是否已登录，已登录则直接跳转
    window.addEventListener('load', async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        await redirectByRole();
      }
    });

    // 登录处理
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('login-message');
      const btn = document.getElementById('login-btn');
      
      if (!email || !password) {
        messageEl.textContent = '请填写邮箱和密码';
        messageEl.className = 'mt-4 text-sm text-center text-red-500';
        return;
      }

      // 显示加载状态
      btn.disabled = true;
      btn.textContent = '登录中...';
      messageEl.textContent = '';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      
      if (error) {
        messageEl.textContent = '登录失败：' + error.message;
        messageEl.className = 'mt-4 text-sm text-center text-red-500';
        btn.disabled = false;
        btn.textContent = '登录';
        return;
      }

      // 登录成功，获取用户角色并跳转
      messageEl.textContent = '登录成功，正在加载用户信息...';
      messageEl.className = 'mt-4 text-sm text-center text-green-600';

      try {
        // 查询用户角色
        const { data: profile, error: profileError } = await sb
          .from('profiles')
          .select('name, role')
          .eq('id', data.user.id)
          .single();

        if (profileError || !profile) {
          console.error('profile查询失败:', {
            userId: data.user.id,
            error: profileError,
            data: profile
          });
          const errMsg = profileError ? profileError.message : '返回空数据';
          throw new Error('未找到用户资料：' + errMsg + '（用户ID: ' + data.user.id + '）');
        }

        messageEl.textContent = `欢迎 ${profile.name}，正在跳转...`;

        // 按角色跳转
        setTimeout(() => {
          if (profile.role === 'teacher') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 500);
      } catch (e) {
        console.error('登录后加载用户信息失败:', e);
        messageEl.textContent = '登录异常：' + e.message;
        messageEl.className = 'mt-4 text-sm text-center text-red-500';
        btn.disabled = false;
        btn.textContent = '登录';
        // 登出，避免卡在已登录但无角色的状态
        await sb.auth.signOut();
      }
    }

    // 支持回车登录
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('email').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
