<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自牧平施教练班 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">自牧平施教练班</h1>
    
    <!-- 登录表单 -->
    <div id="login-form">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-medium mb-2">邮箱</label>
        <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入邮箱">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-medium mb-2">密码</label>
        <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入密码">
      </div>
      <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">登录</button>
      <p id="login-message" class="mt-4 text-sm text-center"></p>
    </div>

    <!-- 登录后显示 -->
    <div id="user-info" class="hidden">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
          <span id="user-avatar" class="text-2xl font-bold text-blue-600"></span>
        </div>
        <h2 id="user-name" class="text-xl font-semibold text-gray-800"></h2>
        <p id="user-role" class="text-sm text-gray-500"></p>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-md p-4 mb-4">
        <p class="text-green-700 text-sm">✓ 系统连接正常，登录成功！</p>
      </div>
      <button onclick="handleLogout()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-md hover:bg-gray-300 transition">退出登录</button>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    // 页面加载时检查登录状态
    window.addEventListener('load', async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        showUserInfo(user);
      }
    });

    // 登录
    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('login-message');
      
      if (!email || !password) {
        messageEl.textContent = '请填写邮箱和密码';
        messageEl.className = 'mt-4 text-sm text-center text-red-500';
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      
      if (error) {
        messageEl.textContent = '登录失败：' + error.message;
        messageEl.className = 'mt-4 text-sm text-center text-red-500';
        return;
      }

      showUserInfo(data.user);
    }

    // 显示用户信息
    async function showUserInfo(user) {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('user-info').classList.remove('hidden');

      // 获取用户资料
      const { data: profile } = await supabase
        .from('profiles')
        .select('name, role')
        .eq('id', user.id)
        .single();

      const name = profile ? profile.name : user.email;
      const role = profile ? (profile.role === 'teacher' ? '老师/管理员' : '学员') : '未设置';
      
      document.getElementById('user-name').textContent = name;
      document.getElementById('user-role').textContent = role;
      document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
    }

    // 退出登录
    async function handleLogout() {
      await sb.auth.signOut();
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('user-info').classList.add('hidden');
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
