<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量上传资源 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 导航栏由 auth.js 动态渲染 -->

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 页面标题 -->
    <div class="mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">📦 批量上传资源</h1>
          <p class="text-gray-500 mt-1">一次性上传多个PDF文件，自动从文件名提取标题</p>
        </div>
        <a href="resources.html" class="text-sm text-blue-600 hover:text-blue-700 font-medium">← 返回资源管理</a>
      </div>
    </div>

    <!-- 上传配置 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">上传配置</h2>
      
      <!-- 资源范围 -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">资源范围</label>
        <div class="flex gap-3">
          <label class="flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition" id="scope-global-label">
            <input type="radio" name="scope" value="global" checked class="mr-2" onchange="switchScope('global')">
            <span class="text-sm font-medium text-blue-700">全局共享（所有班级可用）</span>
          </label>
          <label class="flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition" id="scope-class-label">
            <input type="radio" name="scope" value="class" class="mr-2" onchange="switchScope('class')">
            <span class="text-sm font-medium text-gray-600">指定班级</span>
          </label>
        </div>
      </div>

      <!-- 班级选择 -->
      <div id="class-select-area" class="mb-4 hidden">
        <label class="block text-sm font-medium text-gray-700 mb-2">选择班级</label>
        <select id="class-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
          <option value="">加载中...</option>
        </select>
      </div>

      <!-- 文件命名规则说明 -->
      <div class="bg-blue-50 border border-blue-100 rounded-lg p-4">
        <p class="text-sm text-blue-800 font-medium mb-1">💡 自动提取标题规则</p>
        <p class="text-xs text-blue-600">文件名格式如「01_什么是教练.pdf」，自动去除编号和扩展名，提取标题为「什么是教练」</p>
      </div>
    </div>

    <!-- 文件选择区域 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">选择PDF文件</h2>
      
      <!-- 拖拽/点击上传区域 -->
      <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" multiple accept=".pdf" class="hidden" onchange="handleFileSelect(event)">
        <div class="text-5xl mb-3">📄</div>
        <p class="text-gray-700 font-medium">点击选择或拖拽PDF文件到这里</p>
        <p class="text-gray-400 text-sm mt-1">支持多选，单个文件不超过10MB</p>
      </div>

      <!-- 已选择文件列表 -->
      <div id="file-list-area" class="mt-4 hidden">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-medium text-gray-700">已选择 <span id="file-count">0</span> 个文件</h3>
          <button onclick="clearFiles()" class="text-sm text-red-600 hover:text-red-700">清空列表</button>
        </div>
        <div id="file-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
      </div>
    </div>

    <!-- 上传进度 -->
    <div id="upload-progress-area" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hidden">
      <h2 class="text-base font-semibold text-gray-800 mb-4">上传进度</h2>
      
      <!-- 总体进度 -->
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm text-gray-600">总体进度</span>
          <span class="text-sm font-medium text-gray-800"><span id="uploaded-count">0</span> / <span id="total-count">0</span></span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-3">
          <div id="overall-progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- 当前上传文件 -->
      <div id="current-file-info" class="bg-gray-50 rounded-lg p-3">
        <p class="text-sm text-gray-600">正在上传：<span id="current-file-name" class="font-medium text-gray-800">-</span></p>
        <p class="text-xs text-gray-400 mt-1" id="current-file-status">准备中...</p>
      </div>

      <!-- 上传结果列表 -->
      <div id="upload-results" class="mt-4 space-y-2"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center justify-end gap-3">
      <button onclick="clearFiles()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">清空</button>
      <button id="start-upload-btn" onclick="startUpload()" disabled class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-lg font-medium transition flex items-center">
        <span class="mr-2">🚀</span> 开始批量上传
      </button>
    </div>

    <!-- 上传完成提示 -->
    <div id="upload-complete-area" class="mt-6 bg-green-50 border border-green-200 rounded-xl p-6 hidden">
      <div class="flex items-start">
        <div class="text-3xl mr-4">🎉</div>
        <div class="flex-1">
          <h3 class="text-lg font-semibold text-green-800 mb-2">上传完成！</h3>
          <p class="text-sm text-green-700 mb-3">成功上传 <span id="success-count" class="font-bold">0</span> 个文件，失败 <span id="fail-count" class="font-bold">0</span> 个</p>
          <div class="flex gap-3">
            <a href="resources.html" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium transition">查看资源库</a>
            <button onclick="resetUpload()" class="px-4 py-2 bg-white border border-green-300 text-green-700 hover:bg-green-50 rounded-lg text-sm font-medium transition">继续上传</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let selectedFiles = [];
    let isUploading = false;
    let myClasses = [];

    // 页面初始化
    window.addEventListener('load', async () => {
      currentSession = await requireTeacher();
      if (!currentSession) return;
      renderNavbar(currentSession, 'resources');
      loadMyClasses();
      setupDragAndDrop();
    });

    // 加载我的班级
    async function loadMyClasses() {
      try {
        const { data, error } = await sb
          .from('classes')
          .select('id, name')
          .eq('teacher_id', currentSession.user.id)
          .order('name');
        
        if (error) throw error;
        myClasses = data || [];
        
        const select = document.getElementById('class-select');
        if (myClasses.length === 0) {
          select.innerHTML = '<option value="">暂无班级</option>';
        } else {
          select.innerHTML = myClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
      } catch (e) {
        console.error('加载班级失败:', e);
      }
    }

    // 切换资源范围
    function switchScope(scope) {
      const globalLabel = document.getElementById('scope-global-label');
      const classLabel = document.getElementById('scope-class-label');
      const classArea = document.getElementById('class-select-area');
      
      if (scope === 'global') {
        globalLabel.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        globalLabel.querySelector('span').className = 'text-sm font-medium text-blue-700';
        classLabel.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        classLabel.querySelector('span').className = 'text-sm font-medium text-gray-600';
        classArea.classList.add('hidden');
      } else {
        classLabel.className = 'flex-1 flex items-center justify-center p-3 border-2 border-blue-500 bg-blue-50 rounded-lg cursor-pointer transition';
        classLabel.querySelector('span').className = 'text-sm font-medium text-blue-700';
        globalLabel.className = 'flex-1 flex items-center justify-center p-3 border-2 border-gray-200 rounded-lg cursor-pointer transition';
        globalLabel.querySelector('span').className = 'text-sm font-medium text-gray-600';
        classArea.classList.remove('hidden');
      }
    }

    // 设置拖拽上传
    function setupDragAndDrop() {
      const dropZone = document.getElementById('drop-zone');
      
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-blue-400', 'bg-blue-50');
      });
      
      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-blue-400', 'bg-blue-50');
      });
      
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-blue-400', 'bg-blue-50');
        const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
        addFiles(files);
      });
    }

    // 处理文件选择
    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      addFiles(files);
      event.target.value = '';
    }

    // 添加文件到列表
    function addFiles(files) {
      for (const file of files) {
        // 检查是否已存在
        if (selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
          continue;
        }
        // 检查文件大小
        if (file.size > 10 * 1024 * 1024) {
          alert(`文件 ${file.name} 超过10MB，已跳过`);
          continue;
        }
        selectedFiles.push(file);
      }
      renderFileList();
    }

    // 从文件名提取标题
    function extractTitle(filename) {
      // 去除扩展名
      let title = filename.replace(/\.pdf$/i, '');
      // 去除开头的编号（如 01_、01-、01.）
      title = title.replace(/^\d+[_\-\.\s]+/, '');
      return title.trim();
    }

    // 渲染文件列表
    function renderFileList() {
      const listArea = document.getElementById('file-list-area');
      const list = document.getElementById('file-list');
      const count = document.getElementById('file-count');
      const uploadBtn = document.getElementById('start-upload-btn');
      
      count.textContent = selectedFiles.length;
      
      if (selectedFiles.length === 0) {
        listArea.classList.add('hidden');
        uploadBtn.disabled = true;
        return;
      }
      
      listArea.classList.remove('hidden');
      uploadBtn.disabled = false;
      
      list.innerHTML = selectedFiles.map((file, index) => `
        <div class="flex items-center justify-between bg-gray-50 rounded-lg p-3">
          <div class="flex items-center min-w-0 flex-1">
            <span class="text-xl mr-3 flex-shrink-0">📄</span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-gray-800 truncate">${file.name}</p>
              <p class="text-xs text-gray-400">标题：${extractTitle(file.name)} · ${(file.size / 1024).toFixed(1)} KB</p>
            </div>
          </div>
          <button onclick="removeFile(${index})" class="ml-3 p-1 text-gray-400 hover:text-red-500 flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      `).join('');
    }

    // 移除单个文件
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFileList();
    }

    // 清空文件列表
    function clearFiles() {
      if (isUploading) return;
      selectedFiles = [];
      renderFileList();
    }

    // 开始批量上传
    async function startUpload() {
      if (selectedFiles.length === 0 || isUploading) return;
      
      // 检查班级选择
      const scope = document.querySelector('input[name="scope"]:checked').value;
      let classId = null;
      if (scope === 'class') {
        classId = parseInt(document.getElementById('class-select').value);
        if (!classId) {
          alert('请选择班级');
          return;
        }
      }
      
      isUploading = true;
      document.getElementById('start-upload-btn').disabled = true;
      document.getElementById('upload-progress-area').classList.remove('hidden');
      document.getElementById('upload-complete-area').classList.add('hidden');
      document.getElementById('total-count').textContent = selectedFiles.length;
      
      let successCount = 0;
      let failCount = 0;
      const results = [];
      
      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const title = extractTitle(file.name);
        
        document.getElementById('current-file-name').textContent = file.name;
        document.getElementById('current-file-status').textContent = `上传中... (${i + 1}/${selectedFiles.length})`;
        
        try {
          // 1. 上传到Storage
          const ext = 'pdf';
          const path = `global/${Date.now()}_${i}.${ext}`;
          const { error: uploadError } = await sb.storage.from('resources').upload(path, file);
          if (uploadError) throw uploadError;
          
          // 2. 获取公开URL
          const { data: urlData } = sb.storage.from('resources').getPublicUrl(path);
          const fileUrl = urlData.publicUrl;
          
          // 3. 插入数据库
          const resourceData = {
            type: 'pdf',
            title: title,
            file_url: fileUrl,
            description: null,
            class_id: classId
          };
          
          const { error: dbError } = await sb.from('resources').insert(resourceData);
          if (dbError) throw dbError;
          
          successCount++;
          results.push({ name: file.name, success: true });
          
          // 添加到结果列表
          addUploadResult(file.name, true, null);
          
        } catch (e) {
          console.error(`上传失败 ${file.name}:`, e);
          failCount++;
          results.push({ name: file.name, success: false, error: e.message });
          addUploadResult(file.name, false, e.message);
        }
        
        // 更新进度
        const progress = ((i + 1) / selectedFiles.length) * 100;
        document.getElementById('overall-progress-bar').style.width = progress + '%';
        document.getElementById('uploaded-count').textContent = i + 1;
      }
      
      // 上传完成
      isUploading = false;
      document.getElementById('current-file-status').textContent = '上传完成';
      document.getElementById('success-count').textContent = successCount;
      document.getElementById('fail-count').textContent = failCount;
      document.getElementById('upload-complete-area').classList.remove('hidden');
      document.getElementById('start-upload-btn').disabled = false;
    }

    // 添加上传结果
    function addUploadResult(filename, success, error) {
      const resultsDiv = document.getElementById('upload-results');
      const item = document.createElement('div');
      item.className = `flex items-center justify-between p-3 rounded-lg ${success ? 'bg-green-50' : 'bg-red-50'}`;
      item.innerHTML = `
        <div class="flex items-center min-w-0 flex-1">
          <span class="text-lg mr-2 flex-shrink-0">${success ? '✅' : '❌'}</span>
          <span class="text-sm ${success ? 'text-green-800' : 'text-red-800'} truncate">${filename}</span>
        </div>
        ${error ? `<span class="text-xs text-red-600 ml-2 flex-shrink-0">${error}</span>` : ''}
      `;
      resultsDiv.appendChild(item);
    }

    // 重置上传
    function resetUpload() {
      selectedFiles = [];
      isUploading = false;
      renderFileList();
      document.getElementById('upload-progress-area').classList.add('hidden');
      document.getElementById('upload-complete-area').classList.add('hidden');
      document.getElementById('upload-results').innerHTML = '';
      document.getElementById('overall-progress-bar').style.width = '0%';
    }
  </script>
</body>
</html>
