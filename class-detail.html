<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级详情 - 自牧平施教练班</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 导航栏由 auth.js 动态渲染 -->

  <!-- 主内容区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 返回按钮 -->
    <a href="classes.html" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-4 text-sm">
      <span class="mr-1">←</span> 返回班级列表
    </a>

    <!-- 班级信息卡片 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-2xl font-bold text-gray-800" id="class-name">加载中...</h1>
          <p class="text-gray-500 mt-2" id="class-description"></p>
          <div class="flex items-center text-sm text-gray-400 mt-3">
            <span id="class-date"></span>
            <span class="mx-3">·</span>
            <span id="class-status"></span>
          </div>
        </div>
        <div class="text-right">
          <p class="text-3xl font-bold text-blue-600" id="student-count">0</p>
          <p class="text-sm text-gray-400">名学员</p>
        </div>
      </div>
    </div>

    <!-- 学员管理区 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-semibold text-gray-800">学员列表</h2>
        <button onclick="openAddStudentModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
          <span class="mr-2">👤</span> 添加学员
        </button>
      </div>

      <!-- 学员列表 -->
      <div id="student-list" class="space-y-3">
        <!-- 动态渲染 -->
      </div>

      <!-- 空状态 -->
      <div id="empty-students" class="hidden text-center py-12">
        <p class="text-4xl mb-3">👥</p>
        <p class="text-gray-500">还没有学员</p>
        <p class="text-gray-400 text-sm mt-1">点击右上角「添加学员」把学员加入班级</p>
      </div>
    </div>
  </main>

  <!-- 添加学员弹窗 -->
  <div id="add-student-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[80vh] flex flex-col">
      <div class="p-6 border-b">
        <h3 class="text-lg font-semibold text-gray-800">添加学员到班级</h3>
        <p class="text-sm text-gray-400 mt-1">从系统已有学员中选择，勾选后添加</p>
      </div>
      <div class="p-6 overflow-y-auto flex-1">
        <div id="available-students" class="space-y-2">
          <!-- 动态渲染可选学员 -->
        </div>
        <div id="no-available" class="hidden text-center py-8 text-gray-400">
          <p>没有可添加的学员</p>
          <p class="text-sm mt-1">所有学员都已在这个班级中，或系统中还没有学员账号</p>
        </div>
      </div>
      <div class="p-6 border-t flex justify-between items-center">
        <p class="text-sm text-gray-400">没有看到学员？需先在 Supabase 后台创建学员账号</p>
        <div class="flex space-x-3">
          <button onclick="closeAddStudentModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
          <button onclick="addSelectedStudents()" id="add-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition disabled:opacity-50" disabled>添加选中</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentSession = null;
    let classId = null;
    let classInfo = null;
    let selectedStudents = new Set();

    // 页面初始化
    window.addEventListener('load', async () => {
      currentSession = await requireTeacher();
      if (!currentSession) return;
      renderNavbar(currentSession, 'classes');

      // 从 URL 获取班级 ID
      const params = new URLSearchParams(window.location.search);
      classId = params.get('id');
      if (!classId) {
        alert('缺少班级 ID');
        window.location.href = 'classes.html';
        return;
      }

      await loadClassInfo();
      await loadStudents();
    });

    // 加载班级信息
    async function loadClassInfo() {
      try {
        const { data: cls, error } = await sb.from('classes').select('*').eq('id', classId).single();
        if (error) throw error;
        classInfo = cls;

        document.getElementById('class-name').textContent = cls.name;
        document.getElementById('class-description').textContent = cls.description || '暂无描述';
        document.getElementById('class-date').textContent = cls.start_date ? '📅 ' + cls.start_date : '';
        document.getElementById('class-status').innerHTML = cls.status === 'active'
          ? '<span class="px-2 py-0.5 text-xs rounded-full bg-green-100 text-green-700">进行中</span>'
          : '<span class="px-2 py-0.5 text-xs rounded-full bg-gray-100 text-gray-500">已归档</span>';
      } catch (error) {
        alert('加载班级信息失败：' + error.message);
      }
    }

    // 加载班级学员
    async function loadStudents() {
      try {
        const { data: members, error } = await sb
          .from('class_members')
          .select('user_id, joined_at, profiles(id, name, role)')
          .eq('class_id', classId)
          .order('joined_at', { ascending: true });

        if (error) throw error;

        const studentList = document.getElementById('student-list');
        const emptyState = document.getElementById('empty-students');

        if (!members || members.length === 0) {
          studentList.innerHTML = '';
          emptyState.classList.remove('hidden');
          document.getElementById('student-count').textContent = '0';
          return;
        }

        emptyState.classList.add('hidden');
        document.getElementById('student-count').textContent = members.length;

        studentList.innerHTML = members.map(m => {
          const profile = m.profiles;
          return `
            <div class="flex items-center justify-between p-4 border border-gray-100 rounded-lg hover:bg-gray-50 transition">
              <div class="flex items-center">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-medium mr-3">
                  ${profile ? profile.name.charAt(0) : '?'}
                </div>
                <div>
                  <p class="font-medium text-gray-800">${profile ? escapeHtml(profile.name) : '未知用户'}</p>
                  <p class="text-xs text-gray-400">加入时间：${formatDate(m.joined_at)}</p>
                </div>
              </div>
              <button onclick="removeStudent('${m.user_id}')" class="px-3 py-1.5 text-sm text-red-500 hover:bg-red-50 rounded-lg transition">
                移除
              </button>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('加载学员失败:', error);
        alert('加载学员失败：' + error.message);
      }
    }

    // 打开添加学员弹窗
    async function openAddStudentModal() {
      selectedStudents.clear();
      document.getElementById('add-btn').disabled = true;

      try {
        // 获取所有学员
        const { data: allStudents, error } = await sb
          .from('profiles')
          .select('id, name, role')
          .eq('role', 'student')
          .order('name');

        if (error) throw error;

        // 获取当前班级已有的学员 ID
        const { data: members } = await sb
          .from('class_members')
          .select('user_id')
          .eq('class_id', classId);

        const memberIds = new Set((members || []).map(m => m.user_id));

        // 过滤出未加入的学员
        const available = (allStudents || []).filter(s => !memberIds.has(s.id));

        const container = document.getElementById('available-students');
        const noAvailable = document.getElementById('no-available');

        if (available.length === 0) {
          container.innerHTML = '';
          noAvailable.classList.remove('hidden');
        } else {
          noAvailable.classList.add('hidden');
          container.innerHTML = available.map(s => `
            <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-blue-50 hover:border-blue-300 cursor-pointer transition">
              <input type="checkbox" value="${s.id}" onchange="toggleStudent('${s.id}', this.checked)" class="mr-3 w-4 h-4 text-blue-600">
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-sm font-medium mr-3">
                ${s.name.charAt(0)}
              </div>
              <span class="text-gray-700">${escapeHtml(s.name)}</span>
            </label>
          `).join('');
        }

        document.getElementById('add-student-modal').classList.remove('hidden');
      } catch (error) {
        alert('加载可选学员失败：' + error.message);
      }
    }

    // 关闭添加学员弹窗
    function closeAddStudentModal() {
      document.getElementById('add-student-modal').classList.add('hidden');
      selectedStudents.clear();
    }

    // 勾选/取消学员
    function toggleStudent(id, checked) {
      if (checked) {
        selectedStudents.add(id);
      } else {
        selectedStudents.delete(id);
      }
      document.getElementById('add-btn').disabled = selectedStudents.size === 0;
      document.getElementById('add-btn').textContent = selectedStudents.size > 0 ? `添加选中 (${selectedStudents.size})` : '添加选中';
    }

    // 添加选中的学员
    async function addSelectedStudents() {
      if (selectedStudents.size === 0) return;

      const btn = document.getElementById('add-btn');
      btn.disabled = true;
      btn.textContent = '添加中...';

      try {
        const records = Array.from(selectedStudents).map(userId => ({
          class_id: classId,
          user_id: userId
        }));

        const { error } = await sb.from('class_members').insert(records);
        if (error) throw error;

        closeAddStudentModal();
        loadStudents();
      } catch (error) {
        alert('添加学员失败：' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '添加选中';
      }
    }

    // 移除学员
    async function removeStudent(userId) {
      if (!confirm('确定要将这名学员移出班级吗？')) return;

      try {
        const { error } = await sb
          .from('class_members')
          .delete()
          .eq('class_id', classId)
          .eq('user_id', userId);
        if (error) throw error;
        loadStudents();
      } catch (error) {
        alert('移除学员失败：' + error.message);
      }
    }

    // 工具函数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleDateString('zh-CN');
    }
  </script>
</body>
</html>
